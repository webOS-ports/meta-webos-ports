name: Pixel Tablet Trusty workaround

on:
  push:
    branches: [fix/tangorpro-trusty-bootloop]
  pull_request:
    paths:
      - 'meta-luneos/recipes-core/android-system/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/tangorpro-trusty.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the per-device rule and offline staging
        run: python3 tests/test_tangorpro_trusty.py
      - name: Test real bind mounts over a read-only vendor mount
        run: sudo unshare --mount --propagation private python3 tests/test_tangorpro_trusty.py --real-mounts
      - name: Build the experimental overlay bundle
        run: python3 tools/build-tangorpro-bundle.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tangorpro-trusty-workaround
          path: dist/

# gitleaks configuration (https://github.com/gitleaks/gitleaks, v8).
#
# Scan the working tree:            gitleaks dir --config .gitleaks.toml .
# Scan only what a branch adds:     gitleaks git --config .gitleaks.toml --log-opts="origin/wrynose..HEAD" .
#
# A full-history scan reports the Google API key that 0001-Use-Google-as-default-and-add-API-key.patch
# carried for geoclue until 2026-10. That key is public and is to be revoked; deleting it from history
# would not help, so history scans are limited to new commits as above rather than allowlisting it.
#
# Credentials never go into this layer. Recipes take them from variables the builder sets in local.conf
# or a file it includes that no repository holds (GEOCLUE_GOOGLE_API_KEY, GOOGLE_LOCATION_API_KEY,
# GOOGLE_MAPS_API_KEY, GOOGLE_CDAV_CLIENT_ID/_SECRET, <NAME>_CLIENT_ID/_SECRET, ...).

title = "meta-webos-ports"

[extend]
useDefault = true

[allowlist]
description = "Known false positives in meta-webos-ports"
regexes = [
    # Build-time placeholders that recipes replace with the builder's own values.
    '''PLACEHOLDER_[A-Z0-9_]+''',
    # biomd 0004-fingerprint-add-an-AIDL-backend.patch: the fixed enrolment password the fingerprint
    # HAL is given. Not a credential of ours, but a design issue tracked separately (audit M9).
    '''"default_password"''',
]

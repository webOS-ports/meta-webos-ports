# We have conf and classes directories => add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories => add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-luneos-backports-6.1"
BBFILE_PATTERN_meta-luneos-backports-6.1 := "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-luneos-backports-6.1 = "33"

LAYERSERIES_COMPAT_meta-luneos-backports-6.1 = "wrynose"

LAYERDEPENDS_meta-luneos-backports-6.1 = " \
    core \
    openembedded-layer \
"

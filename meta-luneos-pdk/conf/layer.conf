# The pdk-armel pseudo-machine and the multiconfig that builds with it: the ARM
# soft-float userland legacy webOS PDK applications run inside, shipped in
# LuneOS at /opt/pdk/sysroot.
#
# A layer of its own because a machine definition makes a layer a BSP layer, and
# meta-luneos is the distro layer - yocto-check-layer refuses a layer that is
# both. The PDK recipes stay in meta-luneos: most of them install into the main
# LuneOS rootfs, and the multiconfig's BBMASK is written against their paths
# there. This layer holds configuration only.

BBPATH .= ":${LAYERDIR}"

BBFILE_COLLECTIONS += "meta-luneos-pdk"
BBFILE_PATTERN_meta-luneos-pdk := "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-luneos-pdk = "20"
# No recipes, so nothing will ever match the pattern above.
BBFILE_PATTERN_IGNORE_EMPTY_meta-luneos-pdk = "1"

LAYERSERIES_COMPAT_meta-luneos-pdk = "wrynose"

# pdk-armel.conf requires conf/machine/include/arm/arch-armv7a.inc.
LAYERDEPENDS_meta-luneos-pdk = "core"

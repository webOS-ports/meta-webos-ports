#@TYPE: Machine
#@NAME: PDK armel
#@DESCRIPTION: Pseudo-machine for building the ARMv7 soft-float userland that
#              legacy webOS PDK applications run inside.
#
# This is not a device. It exists so that a second, ABI-incompatible userland can
# be built alongside the real LuneOS one, and shipped inside it at
# /opt/pdk/sysroot. See docs/yocto.md.
#
# The whole point is the tune:
#
#   armv7athf-neon  ->  callconvention-hard  ->  Flags 0x5000200  (LuneOS)
#   armv7at-neon    ->  (no callconvention)  ->  Flags 0x5000002  (PDK, Debian armel)
#
# armv7at-neon is EABI5 with the soft-float *calling convention* but a real VFP/NEON
# unit - byte-for-byte the ABI Palm's 2010 PDK toolchain emitted. Do not "fix" this
# to a hf tune: a single hard-float library in the process corrupts every float and
# double that crosses into it.

require conf/machine/include/arm/arch-armv7a.inc

DEFAULTTUNE = "armv7at-neon"

# Nothing here is booted, so there is no kernel, bootloader or image type to
# choose. The only artefact that matters is the rootfs tarball.
PREFERRED_PROVIDER_virtual/kernel = "linux-dummy"
KERNEL_IMAGETYPE = ""
# xz, not bz2: bz2 pulls in pbzip2-native, whose only upstream is a launchpad
# URL that intermittently fails to fetch, and it buys nothing here. xz-native
# is already built by half of oe-core.
IMAGE_FSTYPES = "tar.xz"

MACHINE_FEATURES = "vfat alsa"

# llvmpipe is the fallback renderer; freedreno is what real Adreno hardware wants.
# Both come out of the same mesa build.
XSERVER = ""

# Multiconfig for the ARM soft-float userland that PDK applications live in.
#
# Enable it in conf/local.conf:
#
#     BBMULTICONFIG = "pdk-armel"
#
# and then build the sysroot with:
#
#     bitbake mc:pdk-armel:pdk-sysroot-image
#
# The main LuneOS build consumes the result through the pdk-sysroot recipe, which
# carries an mcdepends on it - so in practice you just build your image and this
# happens underneath. See docs/yocto.md.

MACHINE = "pdk-armel"

# A separate TMPDIR is mandatory. This userland has a different ABI from the main
# build and must not share sysroots, sstate output or package feeds with it.
TMPDIR = "${TOPDIR}/tmp-pdk-armel"

# TCLIBCAPPEND used to be set empty here, because OE would otherwise append
# "-glibc" and leave the pdk-sysroot recipe in the main build guessing where the
# rootfs landed. The variable is gone - "no longer used, modify TMPDIR directly
# if required" - and TMPDIR above is already literal, so there is nothing left to
# suppress.

# Keep it minimal and independent of the LuneOS distro policy - none of the webOS
# components belong in here, only the plumbing the games touch.
DISTRO = "nodistro"
DISTRO_FEATURES = "wayland opengl alsa pulseaudio ipv4 ipv6 largefile xattr zeroconf"

# This one sysroot ships to every LuneOS target, so it must be built for the
# OLDEST kernel in the fleet, not the newest. oe-core defaults OLDEST_KERNEL to
# 5.15, which lets glibc assume modern syscalls and drop the fallbacks;
# meta-luneos already corrects that for halium (OLDEST_KERNEL:aarch64:halium =
# "4.9") but those are machine overrides and MACHINE here is pdk-armel.
#
# statx() arrived in Linux 4.11. sargo runs a halium 4.9 kernel, so glibc's
# unconditional statx returned ENOSYS and every load failed with
#   cannot stat shared object: Error 38
# while the same sysroot ran fine on PineTab2 (6.6.9) and the emulator (6.6.142).
OLDEST_KERNEL = "3.4"

# Mesa needs to produce llvmpipe (for emulated and non-GPU targets) and freedreno
# (for the TouchPad's Adreno 220 - a2xx). Everything else is dead weight here.
#
# No x11 and no dri3: applications reach luna-surfacemanager over Wayland, so the
# X11 paths would only pull xorgproto and libxshmfence in for nothing.
# zlib is not optional despite the name: freedreno's rd_output uses gzopen64 /
# gzerror unconditionally, so -Dzlib=disabled fails at link.
PACKAGECONFIG:pn-mesa = "gbm wayland egl gles opengl gallium gallium-llvm freedreno zlib"

# The apps are the only consumers of this rootfs, and they are not being debugged
# through package management, so keep it small.
PACKAGE_CLASSES = "package_ipk"
INHERIT:remove = "buildhistory"

# SPDX generation off as well. OE-core turns it on for everything through
# INHERIT_DISTRO, and under this multiconfig its tasks do not hash stably -
# "the basehash value changed ... the metadata is not deterministic" on
# do_create_spdx and do_create_recipe_spdx - which fails the build before any
# of it runs. This tree is build plumbing for a soft-float userland, not a
# shipped product that needs an SBOM, so there is nothing to lose by skipping it.
INHERIT_DISTRO:remove = "create-spdx"

# BitBake parses every recipe in every layer once per multiconfig, so all of
# meta-webos-ports gets parsed with MACHINE = "pdk-armel". That breaks recipes
# which assume MACHINE is a real LuneOS device - nyx-modules, for one, does
# SRC_URI:append = " file://${MACHINE}.cmake" and there is no pdk-armel.cmake:
#
#   ERROR: nyx-modules.bb: Unable to get checksum for nyx-modules SRC_URI
#          entry pdk-armel.cmake: file could not be found
#
# None of it belongs in a soft-float userland anyway - this configuration wants
# oe-core and meta-oe plus the PDK recipes, nothing else. So mask everything
# under meta-webos-ports except our own, using a negative lookahead (BBMASK
# entries are Python regexes matched with re.search).
#
# The side effect worth knowing: the backports layers are masked too, so this
# build takes oe-core's mesa rather than meta-luneos-backports-6.0's newer one.
# That is fine here - the guest only needs llvmpipe and freedreno - but it does
# mean the two userlands can be on different Mesa versions.
# Only two things from meta-webos-ports belong in this configuration: the shims
# (pdk-luneos) and the image that packages them, plus sdl12-compat underneath.
# pdk-sysroot, pdk-tools, pdk-sysroot-fonts and packagegroup-luneos-pdk are
# main-configuration recipes - they install into the LuneOS rootfs and depend on
# luna-send and luna-init-fonts, which are masked here. Parsed in this
# multiconfig they resolve to nothing and take pdk-sysroot-image down with them.
# Mask meta-luneos itself - its recipes assume MACHINE is a real device - and
# meta-luneui, which is all webOS services the guest has no use for. Keep our own
# recipes, and keep BOTH backports layers: they hold nothing but newer versions
# of generic core recipes (meson, wayland-protocols, mesa, ell, ofono) and the
# guest needs them for exactly the same reasons the host build does. Masking them
# wholesale meant the guest silently built against oe-core's Mesa 24 while the
# host was on 26.2, and then failed outright once 26.2 was wanted:
#
#   meson.build:9:18: ERROR: Meson version is 1.3.1 but project requires >= 1.4.0
#
# (meson 1.12.0 is in meta-luneos-backports-6.0.)
# NB the exempted paths have no leading slash: the pattern already consumed
# "meta-luneos/", so what the lookahead sees starts at "recipes-...". An
# earlier version required "/recipes-pdk/" and silently masked the shims and
# the image along with everything else:
#   ERROR: Nothing PROVIDES 'pdk-sysroot-image'
# recipes-devtools/llvm is exempt too: its bbappend fixes LLVM_HOST_TRIPLE for
# cross builds, without which the guest LLVM registers no targets and llvmpipe
# cannot create an execution engine. That matters more here than anywhere.
BBMASK += "meta-webos-ports/meta-luneos/(?!.*(?:recipes-pdk/(?:pdk-luneos/pdk-luneos_git\.bb|images/)|sdl12-compat/|sdl12-libs/|recipes-devtools/llvm/))"
BBMASK += "meta-webos-ports/meta-luneui/"

# The device and BSP layers go with them. A soft-float guest userland has no
# machine of its own - it is a library tree, not something that boots - so
# kernels, bootloaders, modems and display stacks are all noise here. Left in,
# their bbappends dangle against the recipes masked above:
#
#   ERROR: No recipes in pdk-armel available for:
#     meta-rpi-luneos/recipes-webos/nyx-modules/nyx-modules.bbappend
#     meta-smartphone/meta-mainline/recipes-graphics/mesa/mesa_26.1.0.bbappend
#     ...
BBMASK += "meta-(pine64-luneos|rpi-luneos|raspberrypi|rockchip|smartphone|arm)/"

# devtool's workspace layer appends whatever recipe is being worked on. Those
# recipes are almost always LuneOS components masked above, so the append
# would dangle and hard-error this multiconfig. The guest userland never
# builds anything from a devtool workspace anyway.
BBMASK += "/workspace/appends/"

# There used to be a BB_DANGLINGAPPENDS_WARNONLY backstop here, because masking a
# recipe whose bbappend lives in an unmasked layer is a hard error and a dangling
# append is the expected outcome in this configuration. BitBake removed the
# variable - "support for the variable was removed as it unconditionally affects
# all layers" - and there is no per-layer replacement, so anything masked below
# has to have its appends masked with it.

# NOTE: BBFILE_PATTERN_IGNORE_EMPTY_<collection> would silence the
#   WARNING: No bb files in pdk-armel matched BBFILE_PATTERN_hp-layer
# warnings the masking above produces, but it cannot be set here. cooker.py
# calls collection_priorities(..., self.data) with the *base* datastore, not the
# multiconfig one, so the setting is only ever read from conf/local.conf even
# though the warning it suppresses is per-multiconfig. See docs/yocto.md.

# Legacy binaries are not going to satisfy modern QA. They are prebuilt, decade-old
# and not ours; the checks that matter (ABI, sonames) are made explicitly instead.
WARN_QA:remove = "ldflags useless-rpaths"

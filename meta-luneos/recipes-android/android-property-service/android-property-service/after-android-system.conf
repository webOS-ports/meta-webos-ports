[Unit]
# The properties this service hands out live in the container's property area,
# which the Android side creates. libhybris dlopens bionic's libcutils on the
# first property_get and keeps it for the life of the process, so a copy that
# initialises before android-system is up answers every later query with the
# default value and never recovers.
#
# Upstream's unit orders itself after ls-hubd only. This belongs there rather
# than here, but the service is COMPATIBLE_MACHINE = "^halium$" anyway, so
# nothing without an Android container ever installs it.
After=android-system.service

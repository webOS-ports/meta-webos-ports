# bluetoothd turns a headset's AVRCP buttons into key events through
# /dev/uinput: an input device "<headset> (AVRCP)" that the shell and the
# app in front read as media keys. On Halium devices /dev/uinput is
# system:bluetooth 0660 (Android's ueventd rules, 65-android.rules), and
# bluetoothd runs neither in that group nor with CAP_DAC_OVERRIDE, so every
# headset logged "AVRCP: failed to create uinput ... No such file or
# directory" (the last of the three paths it tries) and its buttons never
# became keys. The group is enough; elsewhere, where uinput is root's, this
# changes nothing.
[Service]
SupplementaryGroups=bluetooth

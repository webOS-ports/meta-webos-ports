# Forget any saved Bluetooth rfkill state at boot.
#
# On LuneOS, com.webos.service.bluetooth2 switches Bluetooth on and off through
# BlueZ's Powered property and never touches rfkill, so a saved soft-block is
# never the user's choice. One gets saved anyway: connman's bluetooth plugin
# soft-blocked every Bluetooth switch (now disabled, see connman.sh.in), and
# systemd-rfkill saved that state. From then on it restored the block onto
# every new hci0 that bluebinder created. bluetoothd then logged "Failed to set
# mode: Blocked through rfkill (0x12)" and the Settings toggle failed
# ("Failed to change bluetooth power status"). An ExecStartPre unblock in
# bluetooth.service cannot fix this. D-Bus activation can start bluetoothd
# before bluebinder's vhci exists, and systemd-rfkill restores the block
# afterwards (seen on pioneer). Removing the saved state before either runs
# does fix it: a new switch then takes the kernel default (unblocked), and
# Qualcomm's bt_power still starts blocked from its own driver.
r /var/lib/systemd/rfkill/bluetooth
r /var/lib/systemd/rfkill/*:bluetooth

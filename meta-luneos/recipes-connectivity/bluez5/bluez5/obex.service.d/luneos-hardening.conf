# obexd takes pushes and FTP/PBAP/MAP sessions from any nearby Bluetooth
# device, so limit what a bug in it can reach. It stays root for now: the
# transfer targets come from callers of the Bluetooth service (OPP into
# /media/internal, PBAP and MAP into whatever file the caller names, or a temp
# file in /tmp that the caller then reads), so its view of /var, /tmp, /media
# and /home is left as it is.
#
# The Bluetooth sockets reach it from bluetoothd over D-Bus (Profile1
# NewConnection), so it needs no device nodes and no network capabilities.
[Service]
NoNewPrivileges=yes
ProtectSystem=full
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
# Read and write files of any owner below the transfer roots, nothing more.
CapabilityBoundingSet=CAP_DAC_OVERRIDE CAP_DAC_READ_SEARCH
RestrictAddressFamilies=AF_UNIX AF_BLUETOOTH
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM

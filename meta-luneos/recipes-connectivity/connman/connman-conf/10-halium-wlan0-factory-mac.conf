# The Broadcom/Synaptics (synadhd) Wi-Fi driver registers wlan0 with a
# placeholder MAC (00:90:4c:xx:xx:xx, random tail) and only takes the factory
# MAC when the firmware loads at interface-up. connman keys saved networks by
# the MAC it sees when it creates the device, so every boot looked like a new
# adapter and forgot the passphrase. Bring wlan0 up and wait for the real MAC
# before connman starts. /vendor/firmware is mapped by android-system, which
# connman.service is already ordered after on halium.
[Service]
ExecStartPre=-/bin/sh -c 'i=0; while [ $i -lt 30 ] && [ ! -e /sys/class/net/wlan0 ]; do sleep 1; i=$((i+1)); done; [ -e /sys/class/net/wlan0 ] || exit 0; ip link set wlan0 up; while [ $i -lt 45 ]; do a=$(cat /sys/class/net/wlan0/address); case "$a" in 00:90:4c*|00:90:4C*|"") sleep 1; i=$((i+1)) ;; *) break ;; esac; done; echo "connman: wlan0 mac $a after ${i}s"'

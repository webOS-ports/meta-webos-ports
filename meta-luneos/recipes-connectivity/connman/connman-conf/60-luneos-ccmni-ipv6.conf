# MediaTek modems (ccmni*) keep data connections up that are not the
# internet: MediaTek's VoLTE stack has an IMS one, and the interface of a
# deactivated context can stay up. Their router advertisements made them
# the IPv6 default route, and IPv6 connections hung there. Take no default
# route from router advertisements on them; connman's ofono plugin turns it
# on for the interface of the active internet context (connman 0026).
net.ipv6.conf.ccmni*.accept_ra_defrtr = 0

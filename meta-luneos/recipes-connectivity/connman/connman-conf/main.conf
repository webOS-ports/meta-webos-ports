[General]

# Set input request timeout. Default is 120 seconds
# The request for inputs like passphrase will timeout
# after certain amount of time. Use this setting to
# increase the value in case of different user
# interface designs.
# InputRequestTimeout = 120

# Set browser launch timeout. Default is 300 seconds
# The request for launching a browser for portal pages
# will timeout after certain amount of time. Use this
# setting to increase the value in case of different
# user interface designs.
# BrowserLaunchTimeout = 300

# Enable background scanning. Default is true.
# Background scanning will start every 5 minutes unless
# the scan list is empty. In that case, a simple backoff
# mechanism starting from 10s up to 5 minutes will run.
# BackgroundScanning = true

# List of Fallback timeservers separated by ",".
# These timeservers are used for NTP sync when there are
# no timeserver set by the user or by the service.
# These can contain mixed combination of fully qualified
# domain names, IPv4 and IPv6 addresses.
#
# Nothing else on the device will set the clock. ntpd is running, but the
# ntp recipe's default /etc/ntp.conf lists only the undisciplined local clock
# (server 127.127.1.0, stratum 14), so it disciplines the machine against
# itself and never contacts anything. A phone has no RTC battery either, so
# without this the clock is whatever it was at flash time.
#
# That is not a cosmetic problem: a clock in the past makes every TLS
# certificate "not yet valid", so HTTPS fails everywhere - the browser cannot
# load a page and connman's own online check fails, leaving services stuck in
# "ready" with online-check-failed. Observed on sargo, a year behind.
#
# TimeUpdates defaults to auto, so connman syncs from these itself. NITZ from
# the modem would be better where there is a SIM, but this has to work on a
# device with no modem at all.
FallbackTimeservers = 0.pool.ntp.org,1.pool.ntp.org,2.pool.ntp.org,3.pool.ntp.org

# List of fallback nameservers separated by "," used if no
# nameservers are otherwise provided by the service. The
# nameserver entries must be in numeric format, host
# names are ignored.
# FallbackNameservers =

# List of technologies that are marked autoconnectable
# by default, separated by commas ",". The default value
# for this entry when empty is ethernet,wifi,cellular.
# Services that are automatically connected must have been
# set up and saved to storage beforehand.
# DefaultAutoConnectTechnologies =

# List of technologies that are marked enabled or powered by default,
# separated by commas ",". The default value for this entry when empty is
# ethernet, which would leave WiFi powered off on a freshly flashed device
# until something explicitly enables it. The webOS OSE connman fork forced
# this in technology_load(); connman 2.0 made it configurable instead.
DefaultEnabledTechnologies = ethernet,wifi

# List of preferred technologies from the most preferred
# one to the least preferred one separated by commas ",".
# Services of the listed technology type will be tried one
# by one in the order given, until one of them gets connected
# or they are all tried. A service of a preferred technology
# type in state 'ready' will get the default route when
# compared to another preferred type further down the list
# with state 'ready' or with a non-preferred type; a service
# of a preferred technology type in state 'online' will get
# the default route when compared to either a non-preferred
# type or a preferred type further down in the list.
# PreferredTechnologies =

# List of blacklisted network interfaces separated by ",".
# Found interfaces will be compared to the list and will
# not be handled by connman, if their first characters
# match any of the list entries. Default value is
# vmnet,vboxnet,virbr,ifb,ve-,vb-,ham,veth.
# This setting replaces the default rather than extending it, so the upstream
# entries have to be repeated alongside our own "usb" (which keeps connman off
# the USB gadget interfaces).
NetworkInterfaceBlacklist = vmnet,vboxnet,virbr,ifb,ve-,vb-,ham,veth,usb

# Allow connman to change the system hostname. This can
# happen for example if we receive DHCP hostname option.
# Default value is true.
# AllowHostnameUpdates = true

# Keep only a single connected technology at any time. When a new
# service is connected by the user or a better one is found according
# to PreferredTechnologies, the new service is kept connected and all
# the other previously connected services are disconnected. With this
# setting it does not matter whether the previously connected services
# are in 'online' or 'ready' states, the newly connected service is
# the only one that will be kept connected. A service connected by the
# user will be used until going out of network coverage. With this
# setting enabled applications will notice more network breaks than
# normal. Default value is false.
# SingleConnectedTechnology = false

# List of technologies for which tethering is allowed separated by ",".
# The default value is wifi,bluetooth,gadget. Only those technologies
# listed here are used for tethering. If ethernet tethering is desired,
# then ethernet should be added to the list. The technologies listed here
# have to support tethering, currently tethering is implemented for wifi,
# bluetooth, gadget and ethernet.
# NOTE that if ethernet tethering is enabled, then a DHCP server is
# started on all ethernet interfaces. Tethered ethernet should
# never be connected to corporate or home network as it will disrupt
# normal operation of these networks. Due to this ethernet is not
# tethered by default. Do not activate ethernet tethering unless you
# really know what you are doing.
# TetheringTechnologies = wifi,bluetooth,gadget

# Restore earlier tethering status when returning from offline mode,
# re-enabling a technology, and after restarts and reboots.
# Default value is false.
# PersistentTetheringMode = false

# Automatically enable Anycast 6to4 if possible. This is not recommended, as
# the use of 6to4 will generally lead to a severe degradation of connection
# quality. See RFC6343. Default value is false (as recommended by RFC6343
# section 4.1).
# Enable6to4 = false

# Keep checking that the default service can actually reach the internet,
# instead of doing it once on connect and never again. After
# OnlineCheckFailuresThreshold consecutive failures (6 by default) the service
# drops back from "online" to "ready" with Error=online-check-failed, which
# lets another service take over the default route; it is promoted again after
# OnlineCheckSuccessesThreshold consecutive successes.
#
# It supersedes the deprecated EnableOnlineCheck and
# EnableOnlineToReadyTransition settings.
#
# This is NOT a replacement for the webOS OSE fork's "No Internet issue" patch,
# as an earlier version of this comment claimed. That patch made services
# report online without proving reachability; no OnlineCheckMode does that.
# "none" is the opposite of always-online - online_check_is_enabled_check()
# logs "Online check disabled; interface ... remains in ready state" and the
# service is then never promoted, since ONLINE is only ever set from
# handle_online_check_success().
#
# On sargo the service stays in "ready" even so. Traced with connman's own
# debug (touch /var/lib/connman/debug-mode): the proxy lookup resolves DIRECT,
# the request goes out and wispr_portal_web_result_success() logs status 204 -
# but the tracked check was already cancelled by then. start_online_check()
# cancels any in-flight check for the type before starting another, the
# default-service assignment cancels them too, and a cancelled check completes
# with -125 and reschedule 0. The 204 lands on an orphaned context and no
# promotion happens.
#
# Ruled out while chasing it: the check URL (204 confirmed by hand and by
# connman), the proxy method, OnlineCheckSuccessesThreshold (tried 1), and the
# stray IPv6 RA default route the modem puts on rmnet_data0 (removed it, no
# change). It looks like a connman race rather than anything configurable.
#
# Left on deliberately. It costs nothing now that pacrunner answers the proxy
# lookup - no error is set and no request loops - and it is what we want the
# moment the promotion works. Nothing in LuneOS depends on the distinction:
# webos-connman-adapter's connman_service_is_connected() accepts ready as well
# as online, which is why WiFi reports connected and apps work regardless.
OnlineCheckMode = continuous

# Back off between checks along the Fibonacci series rather than the geometric
# one. Both start out the same, but Fibonacci backs off far harder past the
# 144 second mark (an hour at step 19, where geometric needs step 60), which
# suits a battery powered device that is out of coverage for a while.
OnlineCheckIntervalStyle = fibonacci

# Where that check points. connman's built-in default is
# http://ipv4.connman.net/online/status.html (and the ipv6 host for v6), which
# no longer answers - measured from sargo it resets the connection, so a device
# with perfectly good internet never leaves "ready" and permanently carries
# Error=online-check-failed. With OnlineCheckMode=continuous above that is not
# a one-off: it retries for the life of the connection.
#
# gstatic's generate_204 is the endpoint Android uses for exactly this. It is
# cheap (204, no body), stable, and reachable; verified 204 from the device,
# alongside connectivity-check.ubuntu.com as the same thing under a less
# Google-shaped name. connman treats 2xx as online and a redirect as a captive
# portal, so a 204 gets both cases right.
OnlineCheckIPv4URL = http://www.gstatic.com/generate_204
OnlineCheckIPv6URL = http://ipv6.gstatic.com/generate_204

# We're supplying our own wpa-supplicant configuration file here which adds some tweaks
# for running wpa-supplicant like enabling the cli interface on startup etc.
WpaSupplicantConfigFile=/etc/wpa_supplicant.conf

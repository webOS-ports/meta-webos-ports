# connman-vpnd's upstream CapabilityBoundingSet is missing capabilities that
# some of the VPN plugins need in the processes they spawn:
#
#  - CAP_SYS_ADMIN: the l2tp plugin's client-side pppd asks the kernel for a
#    fresh PPP unit (PPPIOCNEWUNIT via /dev/ppp) to hand the tunnel a real
#    network interface: some kernels gate that ioctl on CAP_SYS_ADMIN, not
#    just CAP_NET_ADMIN.
#  - CAP_DAC_OVERRIDE: on those same kernels, /dev/ppp is mode 0660
#    root:vpn - opening it needs a privileged process to be able to override
#    that group check, since connman-vpnd runs in neither the vpn group nor
#    with a group override configured.
#
# Without both, the l2tp plugin's own client pppd instance fails at "Couldn't
# open the /dev/ppp device: Permission denied" / "Sorry - this system lacks
# PPP kernel support" on every connect attempt, even though pppd works fine
# for everything else (including the same device opened by an unconfined
# process). Confirmed against a real L2TP/PPP handshake (LCP, CHAP auth,
# IPCP) on a Halium sargo device - it fails identically until both
# capabilities are present.
[Service]
CapabilityBoundingSet=CAP_KILL CAP_NET_ADMIN CAP_NET_BIND_SERVICE CAP_NET_RAW CAP_SETGID CAP_SETUID CAP_CHOWN CAP_FOWNER CAP_SYS_ADMIN CAP_DAC_OVERRIDE

<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only the daemon's own user may own the name. It also has to reach
       oFono, whose policy only lets root and the console in. -->
  <policy user="mmsd">
    <allow own="org.ofono.mms"/>
    <allow send_destination="org.ofono"/>
  </policy>
  <policy user="root">
    <allow own="org.ofono.mms"/>
    <!-- oFono (User=root) delivers WAP push messages to mmsd's agent. -->
    <allow send_destination="org.ofono.mms"
           send_interface="org.ofono.PushNotificationAgent"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.ofono.mms"/>
    <!-- Only oFono may hand mmsd a push PDU or release its agent;
         anyone else could inject M-Notification.ind messages that
         make mmsd fetch a URL of their choosing. -->
    <deny send_destination="org.ofono.mms"
          send_interface="org.ofono.PushNotificationAgent"/>
  </policy>
</busconfig>

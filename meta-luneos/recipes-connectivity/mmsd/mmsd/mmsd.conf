<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only the daemon's own user may own the name. It also has to reach
       oFono, whose policy only lets root and the console in. -->
  <policy user="mmsd">
    <allow own="org.ofono.mms"/>
    <allow send_destination="org.ofono"/>
  </policy>
  <policy user="root">
    <allow own="org.ofono.mms"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.ofono.mms"/>
  </policy>
</busconfig>

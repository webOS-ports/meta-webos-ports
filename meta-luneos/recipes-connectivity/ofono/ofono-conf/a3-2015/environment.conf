# Mainline msm8916: there is no Android RIL on this device, so oFono must not be
# told to create one.
#
# OFONO_RIL_DEVICE is read by oFono itself, in plugins/rildev.c. detect_init()
# returns immediately when it is unset, and otherwise creates and registers
# ril_<slot> modems using its value as the driver name. The shared default sets
# it to "ril", and because rilmodem is only configured out for Halium builds the
# "ril" driver really does exist in a mainline oFono - so the A3 ends up with a
# permanently dead /ril_0 (Powered=false, Online=false) and nothing else. That is
# the only modem oFono reports here, which makes it look as though modem
# detection failed when in fact nothing ever tried to detect this modem.
#
# Leaving OFONO_RIL_DEVICE unset is what a mainline device wants: rildev then
# creates nothing and /ril_0 disappears. (pinephone, pinephonepro and pinetab2
# instead set it to "qmimodem", which suppresses the modem only as a side effect
# - that is a driver-directory name, not a modem plugin name, so registration
# just fails.)
#
# This does not by itself give the A3 telephony. The real modem is a QMUX port,
# /dev/wwan0qmi0, exposing dms/nas/wds/uim/voice/wms, and oFono 2.19 cannot
# reach it: qrtrqmi only scans QRTR, and gobi_probe() requires a USB qmi_wwan
# modem. See a3-2015-STATUS.md.
OFONO_OPTIONS=--noplugin=hfp_bluez5

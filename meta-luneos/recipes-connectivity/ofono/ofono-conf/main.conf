# oFono reads this file for its own groups; ofono-ext's slot manager (the
# multi-SIM layer ofono-binder-plugin needs on Halium devices) reads the
# [ModemManager] group from it too.

[ModemManager]
# Which SIM carries mobile data. With one SIM slot the slot manager simply
# uses it. With two it only uses the SIM stored as DefaultDataSim
# (org.nemomobile.ofono.ModemManager, set from Settings > Network through the
# telephony service) and otherwise none at all, so mobile data would stay off
# on a freshly set up dual-SIM phone with nothing to say why.
#
# "once": when no data SIM is stored, wait until every inserted SIM is
# initialised, take the first one that is online and store it; choosing
# another one later works as before. "always" would make the same pick but
# never store it, so the choice could change with the SIMs present.
AutoSelectDataSim=once

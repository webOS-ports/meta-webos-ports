# Pixel 3a (sargo). One physical SIM plus an eUICC.
#
# sargo's vendor RIL is a multi-SIM build: init starts qcrild and qcrild2, and
# both register with hwservicemanager, so the HAL advertises
# android.hardware.radio@1.x::IRadio/slot1 *and* /slot2. ofono-binder-plugin
# enumerates the slots from the HAL rather than from this file, so leaving slot2
# undeclared is not "single SIM", it is a missing entry: ofonod aborts at startup
# with "Missing path for slot slot2" and systemd restarts it forever.
#
# Declaring slot2 lets both modems come up. ExpectSlots stays at slot1 so boot
# does not wait on the eUICC slot, which is empty unless a profile is installed.
[Settings]
ExpectSlots = slot1

[slot1]
path = /ril_0
slot = 0

[slot2]
path = /ril_1
slot = 1

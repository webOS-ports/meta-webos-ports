# Pixel 3a (sargo). One physical SIM slot; the eUICC is not exposed through
# ofono, so a single ril_0 is correct here.
#
# The default ril_subscription.conf still uses socket=/dev/socket/rild, which is
# the pre-Treble transport. sargo runs ofono-halium with ofono-binder-plugin, so
# the RIL is reached over binder instead - matching hammerhead-halium and mako,
# the other single-SIM binder devices. With the socket config ofonod aborts at
# startup ("Missing path for slot slot2") and systemd restarts it forever: 583
# core dumps in 36 minutes on a Test B image, dragging webos-telephonyd (590
# restarts) and webos-hfp-service (406) down with it.
[Settings]
allowDataReq=on

[ril_0]
transport=binder:name=slot1
name=slot1

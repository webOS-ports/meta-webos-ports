# ofonod parses SMS, cell broadcast, USSD and SIM toolkit data from the
# cellular network, so limit what a bug in it can reach. It stays root for
# now: on Halium it talks to /dev/hwbinder and on mainline to modem nodes
# whose owners differ per device.
#
# What it still needs, from the 2.19 sources and the plugins LuneOS ships:
#  - writes only below /var/lib/ofono (STORAGEDIR; StateDirectory= in the unit
#    keeps it writable), plus /sys/class/net/*/qmi/raw_ip from the gobi plugin,
#    so /sys stays writable (no ProtectKernelTunables=);
#  - modem device nodes, so no PrivateDevices=;
#  - CAP_NET_ADMIN and CAP_NET_RAW to configure the data interfaces
#    (SIOCSIFFLAGS, SIOCSIFADDR, SIOCADDRT; the same two ofono-binder-plugin
#    keeps when it changes identity), and CAP_SETUID, CAP_SETGID, CAP_CHOWN
#    and CAP_FOWNER for that identity change (binder.conf Identity=);
#  - CAP_DAC_OVERRIDE for modem and binder nodes owned by Android ids;
#  - the socket families its drivers open (qmi: AF_QIPCRTR, isi: AF_PHONET,
#    stemodem: AF_CAIF, HFP: AF_BLUETOOTH, the AT/PPP stack: AF_PACKET, and
#    AF_ALG for the checksum and cipher code in ell).
[Service]
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
CapabilityBoundingSet=CAP_NET_ADMIN CAP_NET_RAW CAP_NET_BIND_SERVICE CAP_SETUID CAP_SETGID CAP_CHOWN CAP_FOWNER CAP_DAC_OVERRIDE CAP_DAC_READ_SEARCH
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK AF_PACKET AF_BLUETOOTH AF_QIPCRTR AF_PHONET AF_CAIF AF_ALG
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM

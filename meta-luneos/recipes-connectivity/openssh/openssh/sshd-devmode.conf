# SSH only in developer mode. org.webosports.service.devmode starts and stops
# sshd.socket when developer mode is turned on and off; this keeps that choice
# across a reboot. luneos-dev-image writes the flag, so a developer image has
# SSH from the start; luneos-image has it once developer mode is turned on.
[Unit]
ConditionPathExists=/var/luna/dev-mode-enabled

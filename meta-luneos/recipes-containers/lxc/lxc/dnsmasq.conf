# Loaded by the system dnsmasq.service through -7 /etc/dnsmasq.d.
#
# That instance is not enabled on LuneOS (dnsmasq_%.bbappend): lxc-net
# (lxcbr0) and waydroid-net.sh (waydroid0) each start their own dnsmasq
# with --conf-file=/dev/null on their bridge, and connman's dnsproxy owns
# 127.0.0.1:53. If it is started by hand anyway it must not become an open
# resolver on Wi-Fi or cellular, and it must not take the bridges from the
# per-container instances: bind to loopback only. Any interface= or
# except-interface= line also cancels --local-service, so do not add one.
bind-interfaces
interface=lo
no-dhcp-interface=lo

# Tier 2 adaptation for the Unihertz Titan (ro.product.vendor.device Titan).
# Same workaround and the same chip as the Titan Pocket's copy: drop it once
# nfcd-binder-plugin's coreInitialized() gate is fixed (see sargo's copy).
#
# The Titan's ST21NFC (vendor HAL android.hardware.nfc@1.2-service-st, FW
# 0x01087727) initialises and nfcd registers adapter nfc0, but the default
# RF_DISCOVER_CMD (21 03 0b 05 03 01 00 01 01 01 05 01 02 01: passive and
# active NFC-A, NFC-B, passive and active NFC-F) is answered 41 03 01 01,
# NCI STATUS_REJECTED ("[nci] WARNING! > RF_DISCOVER_RSP error 1", 12 Nov
# 2026), and no tag is ever seen.
#
# Costs FeliCa (NFC-F) only.
[Configuration]
Technologies = Poll-A, Poll-B

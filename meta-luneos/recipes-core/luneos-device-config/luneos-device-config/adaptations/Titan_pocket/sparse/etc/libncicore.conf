# Tier 2 adaptation for the Unihertz Titan Pocket (ro.product.vendor.device
# Titan_pocket). Same workaround as sargo's, for the same cause: drop it once
# nfcd-binder-plugin's coreInitialized() gate is fixed (see sargo's copy).
#
# The Pocket's ST21NFC (vendor HAL android.hardware.nfc@1.2-service-st)
# initialises and nfcd registers adapter nfc0, but every RF_DISCOVER is
# answered with NCI STATUS_REJECTED ("[nci] WARNING! > RF_DISCOVER_RSP
# error 1", journal of 2 Oct 2026) and no tag is ever seen. libncicore's
# maintainer diagnoses that error as the controller refusing NFC-F, and
# disabling NFC-F is the confirmed fix for ST21NFC and NXP controllers
# (mer-hybris/nfcd-pn54x-plugin#5, mer-hybris/libncicore#21).
#
# Costs FeliCa (NFC-F) only.
[Configuration]
Technologies = Poll-A, Poll-B

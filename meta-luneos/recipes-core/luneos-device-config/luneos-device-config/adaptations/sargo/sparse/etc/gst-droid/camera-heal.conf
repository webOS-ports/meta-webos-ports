# Opt in to the gst-droid camera provider heal pass on sargo.
#
# camera-droid-heal.service exists only for the defect this board has: the
# vendor camera provider comes up unusable on roughly half of all boots, because
# closing a file handle on the sensor's /dev/v4l-subdevN clears is_probe_succeed
# in cam_sensor_core.c and every CAM_ACQUIRE_DEV afterwards is refused
# ("CAM-SENSOR: cam_sensor_driver_cmd: Not in right state to aquire"). Only a
# re-probe restores it, which is what restarting the provider does.
#
# The unit and its script both gate on this file existing, so a board that does
# not ship it never opens a camera during boot. Nothing reads the contents.
#
# This is Tier 2 (sparse/), applied by one bind mount per file. That is late -
# luneos-device-config finishes around 36 s on sargo - but the healer is ordered
# After=surface-manager-daemon.service, which luneos-device-config is Before=,
# so the file is always in place by the time the condition is evaluated.

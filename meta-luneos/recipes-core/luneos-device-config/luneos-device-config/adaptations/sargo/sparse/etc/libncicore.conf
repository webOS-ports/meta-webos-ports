# Tier 2 adaptation for the Google Pixel 3a (sargo).
#
# Tier 2 because there is nowhere else for it: the library reads a fixed
# /etc/libncicore.conf, sargo builds no rootfs of its own, and the value is
# wrong for every other device. Tier 2 is the last resort by design - drop this
# file once the coreInitialized() gate below is fixed.
#
# Note this relies on the overlayfs path in apply_sparse, not the bind-mount
# fallback: the base rootfs has no /etc/libncicore.conf for a bind to shadow.
# sargo has CONFIG_OVERLAY_FS - waydroid requires it - so the overlay is taken.
#
# sargo's NFC controller (NXP PN81T) rejects RF_DISCOVER outright - NCI
# STATUS_REJECTED, after which libncicore drops to its ERROR state and no tag
# is ever seen - if the requested technology set includes NFC-F. Measured by
# varying this entry: Poll-A alone is accepted, Poll-A + Poll-B is accepted,
# anything including Poll-F is rejected. ActivePollA is accepted, so it is
# NFC-F specifically rather than active poll modes as such.
#
# Two things combine to cause it. libncicore asks for active poll modes even
# in reader/writer mode - NCI_TECH_A_POLL and NCI_TECH_F_POLL are each
# PASSIVE|ACTIVE and the NFC_OP_MODE_RW branch ORs them in - so ActivePollF is
# requested although NFC-DEP is never mapped in RF_DISCOVER_MAP. And the NXP
# HAL never applies the NXP_RF_CONF_BLK_* RF configuration from
# /android/vendor/etc/libnfc-nxp.conf, because it applies that in
# coreInitialized(), which nfcd-binder-plugin only calls while both the
# current and the next NCI state are RFST_IDLE - a window that never opens
# here, since next_state reaches RFST_DISCOVERY first.
#
# Restricting the set to Poll-A and Poll-B gets the adapter to RFST_DISCOVERY
# and tags read: verified with an ISO-DEP Type 4A card. The cost is FeliCa,
# which needs NFC-F. Drop this file once the coreInitialized() gate is fixed
# and check whether NFC-F comes back; the config vocabulary has no
# passive-only option, so it cannot be expressed here.
[Configuration]
Technologies = Poll-A, Poll-B

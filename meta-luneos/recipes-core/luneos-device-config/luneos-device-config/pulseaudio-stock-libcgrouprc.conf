# For an adaptation that sets deviceinfo_pulseaudio_stock_libcgrouprc="1": give
# pulseaudio, and only pulseaudio, the stock system's libcgrouprc.so in place of
# the GSI's. generators/70-pulseaudio-env explains why and puts the file there;
# without it the leading "-" makes this bind a no-op, so the drop-in is safe on
# every device.
[Service]
BindReadOnlyPaths=-/run/luneos-device/pulseaudio-stock/libcgrouprc.so:/android/system/lib64/libcgrouprc.so

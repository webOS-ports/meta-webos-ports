# For an adaptation that sets deviceinfo_pulseaudio_vendor_libtinyxml2="1": give
# pulseaudio, and only pulseaudio, the vendor's libtinyxml2.so in place of the
# GSI's. generators/70-pulseaudio-env explains why and puts the copy there;
# without it the leading "-" makes this bind a no-op, so the drop-in is safe on
# every device.
[Service]
BindReadOnlyPaths=-/run/luneos-device/pulseaudio-vendor/libtinyxml2.so:/android/system/lib64/libtinyxml2.so

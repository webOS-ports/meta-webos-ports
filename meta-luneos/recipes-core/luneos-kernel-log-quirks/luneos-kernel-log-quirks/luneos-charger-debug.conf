# Silence the Qualcomm SMB2 charger driver's debug prints.
#
# qpnp_smb2 ships with debug_mask=31 (every bit set), so while the device is
# on a charger it emits "PMI: smblib_get_prop_usb_online/get_apsd_result/
# get_charge_param ..." continuously - about 4 kernel lines/s on sargo. Those
# go to /dev/kmsg, journald stores them, and the resulting write amplification
# roughly doubles idle flash traffic (measured on sargo: 0.19 GB/h with the
# mask at 31 vs 0.10 GB/h at 0).
#
# 0 is the driver's own default; the vendor kernel config is what sets 31.
# Nothing in LuneOS reads these lines - charging state comes from
# /sys/class/power_supply via nyx, not from the kernel log.
#
# "w" writes only if the file exists, so this is harmless on devices with a
# different PMIC (tissot/MSM8953 has no qpnp_smb2).
w /sys/module/qpnp_smb2/parameters/debug_mask - - - - 0

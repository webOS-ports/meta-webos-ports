# Core dumps hold process memory, keys and passwords included, on an
# unencrypted data partition, so keep them small and few. Without this a dump
# can take up to ProcessSizeMax (1 GB on 32-bit, 32 GB on 64-bit) and all of
# them together 10% of the filesystem, capped at 4 GB. A crash loop gets there
# fast: an Android service that kept dying on sargo left 235 dumps in eight
# minutes.
#
# ExternalSizeMax is compared with the compressed size. A larger dump is not
# kept, but its stack trace is still logged, since ProcessSizeMax is untouched.
# The values are a judgement, not a measurement. systemd-coredump drops the
# oldest dumps to stay under MaxUse.
#
# systemd-coredump has no setting for age; see luneos-coredump-clean.service.
[Coredump]
ExternalSizeMax=128M
MaxUse=256M

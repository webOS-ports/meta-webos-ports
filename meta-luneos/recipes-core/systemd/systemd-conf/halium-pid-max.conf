# Keep process IDs within what 32-bit Android code can handle.
#
# systemd's 50-pid-max.conf raises kernel.pid_max to 4194304 on 64-bit kernels,
# but 32-bit bionic aborts any process whose PID is above 65535 ("32-bit
# pthread_mutex_t only supports pids <= 65535"). The Android container on a
# 64-bit device still runs 32-bit services; on the Q25 the OMX media codec
# service is one. Once the PID counter had passed 65535 (after two days of
# uptime), a restarted OMX service died at start, and so did each 32-bit
# crash_dump started for it - some 16,000 of them - until pid_max was lowered
# to this value at run time, after which the service registered again.
#
# Sorted after 50-pid-max.conf, so this value wins.
kernel.pid_max = 65535

# Bound the journal on every image. journald's own default is 10% of the
# filesystem holding it, which on a phone with a 100 GB userdata is 10 GB, and
# on a device with a persistent /var/log/journal every kernel line the vendor
# drivers print is stored: measured on 2026-09-19, 2.2 GB on the MP01 and
# 1.4 GB on tissot after two days. Beyond the space, journald's writes keep the
# flash busy while the phone should be idle. 200 MB keeps several days of
# normal logging; the vendor-driver chatter itself is silenced by
# luneos-kernel-log-quirks. Small files so vacuuming can free space in steps.
[Journal]
SystemMaxUse=200M
SystemMaxFileSize=32M
RuntimeMaxUse=64M

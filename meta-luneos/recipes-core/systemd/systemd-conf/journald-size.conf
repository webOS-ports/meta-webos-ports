# Bound the journal on every image: journald's default is 10% of the host
# filesystem (10 GB on a 100 GB userdata), and vendor-driver chatter fills it
# fast. 200 MB keeps several days of logging; small files so vacuuming frees
# space in steps. A tiny-root machine sets a lower SystemMaxUse of its own.
#
# No SystemKeepFree=: journald parses it as a byte size (config_parse_iec_uint64),
# not a percentage, and SystemMaxUse already bounds usage.
[Journal]
SystemMaxUse=200M
SystemMaxFileSize=32M
RuntimeMaxUse=64M

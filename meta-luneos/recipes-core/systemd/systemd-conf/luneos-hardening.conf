# Kernel hardening defaults for every LuneOS image.
#
# A leading "-" makes systemd-sysctl skip a key the running kernel does not
# have instead of failing: Yama is not built into the Q25, goyavewifi, comet,
# pinephone or pinetab2 kernels, and the BPF, perf and IPv6 keys depend on the
# kernel configuration.
#
# Checked against what LuneOS runs before choosing the values:
#  - ptrace_scope=1 still lets a process trace its own descendants, and root
#    (CAP_SYS_PTRACE) trace anything, so gdb and strace as root keep working;
#    1 is already Yama's built-in default where it is compiled in. Nothing in
#    the image traces a non-descendant without root: crash-handler is gone,
#    and Chromium's breakpad handler (webruntime) names its dumper with
#    PR_SET_PTRACER, which is what scope 1 asks for.
#  - dmesg_restrict=1 needs CAP_SYSLOG to read the kernel log. journald and
#    the Android container's logd run as root with it; the non-root services
#    (audiod, mediaindexer, the media and wam users) do not read the log.
#  - kptr_restrict=2 hides kernel addresses from root too, which only
#    matters to kernel profiling with perf.
#  - fs.suid_dumpable stays at the 2 set by systemd's 50-coredump.conf. The
#    core of a process that changed its ids (WAM after it drops to wam,
#    avahi, dnsmasq) then goes only to systemd-coredump through the pipe in
#    kernel.core_pattern, readable by root alone. 0 would add nothing to that
#    and lose those crash dumps.
-kernel.kptr_restrict = 2
-kernel.dmesg_restrict = 1
-kernel.yama.ptrace_scope = 1
-kernel.unprivileged_bpf_disabled = 1
-kernel.perf_event_paranoid = 3

# IPv6 privacy addresses (RFC 4941), preferred as the source address, so the
# interface's MAC address does not follow the device from network to network.
-net.ipv6.conf.all.use_tempaddr = 2
-net.ipv6.conf.default.use_tempaddr = 2

# ICMP redirects: neither accepted nor sent. A redirect lets anyone on the
# link who sees a flow move it to another next hop, past the firewall's
# RELATED rule (conntrack treats a redirect quoting a tracked flow as
# related). procps' /etc/sysctl.conf sets only all.accept_redirects=0, and
# for a host that is not forwarding the kernel accepts a redirect when "all"
# OR the interface allows it, so every interface (left at its default 1)
# still accepted them. Hence the "default" and per-interface ("*") lines,
# the way systemd's 50-default.conf sets rp_filter; systemd's udev rule
# applies the "*" lines to each interface as it appears. send_redirects is
# on unless both "all" and the interface turn it off.
#
# Checked against what LuneOS runs:
#  - Tethering (connman: Wi-Fi hotspot, Bluetooth PAN, USB) and Waydroid's
#    bridge forward and NAT through the device; a redirect is only a hint to
#    a client that a better first hop exists on its own link, and the
#    device is the only router on those links, so they lose nothing.
#  - Nothing else sets these keys: connman writes ip_forward and IPv6
#    forwarding (tethering, prefix delegation), rp_filter, disable_ipv6,
#    use_tempaddr and dad_transmits; waydroid-net.sh turns IPv4 and IPv6
#    forwarding on (never off) and sets autoconf and accept_dad on its
#    bridge; the LuneOS layers and webos-connman-adapter set none. (Halium's
#    Android container was not checked.)
#  - The kernel sets ipv4 all.accept_redirects to the opposite of
#    ip_forward whenever ip_forward is written, so once connman stops
#    tethering (and Waydroid has not turned forwarding on) "all" is back at
#    1 until the next boot, and with forwarding
#    off that alone accepts redirects again, whatever the interfaces say.
#    iptables.rules drops ICMP redirects ahead of its RELATED rule for that
#    case; these lines cover the rest of the time and a firewall that did
#    not load.
#  - secure_redirects stays at the kernel's 1. It only narrows which
#    redirects an interface that takes them accepts, and shared_media (1 by
#    default) overrides it; 0, as some checklists have it, would loosen it.
#  - IPv6 looks only at the interface's accept_redirects (and ignores
#    redirects while forwarding), so the "*" line is the one that counts.
#  - Source routing: IPv4 needs all.accept_source_route, already 0 (procps,
#    and systemd's 50-default.conf for every interface). IPv6 keeps the
#    kernel's 0, which accepts only type 2 routing headers (Mobile IPv6,
#    which nothing here uses); type 0 is not accepted at any setting.
-net.ipv4.conf.all.accept_redirects = 0
-net.ipv4.conf.default.accept_redirects = 0
-net.ipv4.conf.*.accept_redirects = 0
-net.ipv4.conf.all.send_redirects = 0
-net.ipv4.conf.default.send_redirects = 0
-net.ipv4.conf.*.send_redirects = 0
-net.ipv6.conf.all.accept_redirects = 0
-net.ipv6.conf.default.accept_redirects = 0
-net.ipv6.conf.*.accept_redirects = 0

[Manager]
# A unit that will not stop should cost seconds, not minutes.
#
# systemd's stop escalation is four waits of TimeoutStopSec, not one:
# stop-sigterm, SIGKILL, final-sigterm, final SIGKILL. At the 90s default a
# single service that cannot be reaped costs six minutes before systemd gives
# up on it. Measured on qemux86-64 with a wedged sam.service: 360s inside
# systemd plus 180s more in systemd-shutdown, for a 9m19s poweroff against a
# normal 3s one.
#
# The slowest unit that stops *normally* on a LuneOS image is the certificate
# manager at 2.1s, so 10s leaves roughly 5x headroom and caps the pathological
# case at ~40s.
DefaultTimeoutStopSec=10s
DefaultTimeoutAbortSec=10s

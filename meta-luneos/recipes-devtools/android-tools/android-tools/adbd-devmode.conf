# adbd only with USB debugging AND developer mode on.
#
# meta-oe's unit asks for /etc/usb-debugging-enabled, but
# org.webosports.service.devmode and the images keep the USB debugging flag in
# /var, so turning it off in Settings was undone at the next boot. The empty
# assignment drops meta-oe's condition; both of these must then hold.
# Developer mode stops adbd and removes the USB flag when it is turned off.
[Unit]
ConditionPathExists=
ConditionPathExists=/var/usb-debugging-enabled
ConditionPathExists=/var/luna/dev-mode-enabled

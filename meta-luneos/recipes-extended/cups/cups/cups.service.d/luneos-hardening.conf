# cupsd parses IPP requests, PPDs and print jobs and runs the filters and
# backends that convert them, all from root. It has to stay root (backends
# such as usb run as root, and it switches the filters to lp), but its view of
# the system can be narrowed. The filters and backends it starts inherit all
# of this, which is the point.
#
# Writable paths are the 2.4 defaults as configured by oe-core: ServerRoot
# /etc/cups (printers.conf, classes.conf, subscriptions.conf, ppd/), the
# spool, cache, log and state directories, and the /etc/printcap it
# regenerates. USB printers need /dev/bus/usb, so no PrivateDevices=.
[Service]
NoNewPrivileges=yes
ProtectSystem=strict
ReadWritePaths=-/etc/cups -/etc/printcap -/var/spool/cups -/var/cache/cups -/var/log/cups -/run/cups
ProtectHome=yes
PrivateTmp=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
# Port 631, the switch to lp for filters, the spool file ownership, and
# stopping filters that run as lp.
CapabilityBoundingSet=CAP_CHOWN CAP_DAC_OVERRIDE CAP_DAC_READ_SEARCH CAP_FOWNER CAP_FSETID CAP_KILL CAP_NET_BIND_SERVICE CAP_SETGID CAP_SETUID CAP_AUDIT_WRITE
# IPP/socket/lpd backends, D-Bus (Avahi), and netlink for getifaddrs() and
# libusb hotplug.
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM

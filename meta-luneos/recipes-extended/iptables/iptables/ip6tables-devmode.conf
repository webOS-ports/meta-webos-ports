# Load ip6tables.rules through luneos-devmode-firewall, so the firewall fails
# closed: it sets the DROP policies first and, should ip6tables.rules be
# refused (a kernel without conntrack), loads ip6tables-fallback.rules, which
# needs no conntrack. Then put developer mode's rule (SSH beyond the USB
# gadget, if it was turned on) back, since loading a rules file empties the
# LUNEOS-DEVMODE chain. See luneos-devmode-firewall.
[Service]
ExecStart=
ExecStart=@SBINDIR@/luneos-devmode-firewall load 6
ExecStartPost=-@SBINDIR@/luneos-devmode-firewall restore 6
ExecReload=
ExecReload=@SBINDIR@/luneos-devmode-firewall load 6
ExecReload=-@SBINDIR@/luneos-devmode-firewall restore 6

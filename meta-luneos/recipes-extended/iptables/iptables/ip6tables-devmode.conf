# Put developer mode's firewall rule (SSH beyond the USB gadget, if it was
# turned on) back after ip6tables.rules has been loaded or reloaded, since loading
# the file empties the LUNEOS-DEVMODE chain. See luneos-devmode-firewall.
[Service]
ExecStartPost=-/usr/sbin/luneos-devmode-firewall restore 6
ExecReload=-/usr/sbin/luneos-devmode-firewall restore 6

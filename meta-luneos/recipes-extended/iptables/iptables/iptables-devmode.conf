# Load iptables.rules through luneos-devmode-firewall, so the firewall fails
# closed: it sets the DROP policies first and, should iptables.rules be
# refused (a kernel without conntrack), loads iptables-fallback.rules, which
# needs no conntrack. Then put developer mode's rule (SSH beyond the USB
# gadget, if it was turned on) back, since loading a rules file empties the
# LUNEOS-DEVMODE chain. See luneos-devmode-firewall.
[Service]
ExecStart=
ExecStart=@SBINDIR@/luneos-devmode-firewall load 4
ExecStartPost=-@SBINDIR@/luneos-devmode-firewall restore 4
ExecReload=
ExecReload=@SBINDIR@/luneos-devmode-firewall load 4
ExecReload=-@SBINDIR@/luneos-devmode-firewall restore 4

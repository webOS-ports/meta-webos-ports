# A fake battery and charger (test_battery, test_ac, test_usb) for the qemu images, which have no
# battery at all: nyx then reports one and batteryd, the status bar and anything that reacts to the
# charge level can be exercised. Writable from /sys/module/test_power/parameters/ (battery_capacity,
# battery_status, ac_online, ...).
CONFIG_TEST_POWER=y

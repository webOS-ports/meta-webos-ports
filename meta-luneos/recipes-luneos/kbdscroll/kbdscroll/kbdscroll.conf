# kbdscroll - scrolling and cursor movement from a capacitive keyboard, a
# trackpad or a navigation pad.
#
# Everything here is commented out: the defaults are worked out from the
# hardware that was found, and on a device whose surface and touchscreen can be
# told apart there is usually nothing to set at all. Start with
#
#     kbdscroll --list
#
# which prints every input device, what it can do, and which of them was picked
# for what. Run "kbdscroll --help" for the full list of settings with their
# current values.
#
# This file is the distro default. Per-machine settings belong in a drop-in -
# /etc/kbdscroll.conf.d/10-<machine>.conf - which is where a machine profile
# shipped by the package lands; later files win, so 90-local.conf overrides it.
# KBDSCROLL_<SETTING> in the environment overrides the files (handy: run
# "systemctl stop kbdscroll" and then "KBDSCROLL_DEBUG=1 kbdscroll" by hand),
# and "kbdscroll key=value" on the command line overrides everything.
#
# Keys may be written with '-' or '_'.

# ---------------------------------------------------------------- the devices
#
# Each of these takes a device path (/dev/input/event3), or a glob matched
# against the device's name - fnmatch, so "stmpe_*keypad" works and a name
# without wildcards has to match in full - or "auto".
#
# Automatic selection, for the record, because it is a heuristic and heuristics
# are worth being able to check:
#   screen  the multitouch device that does NOT look like it belongs to the
#           keyboard, preferring one flagged INPUT_PROP_DIRECT, then the largest
#   pad     a touch device whose name mentions keypad/keyboard/kbd/touchpad/
#           trackpad/nav, and is not the screen; failing that, the smallest
#           remaining touch device, with a warning
#   keys    every device with letters, arrows or modifiers on it
#   arrows  whichever of those has arrow keys; if none does, a virtual keyboard
#           of our own (BlackBerry Classic-style layouts have no arrow keys)
#
#pad = auto
#screen = auto
#keys = auto
#arrows = auto

# Write the injected contacts to a virtual touchscreen of our own instead of
# into the real touchscreen's device node. Only needed where injecting into the
# real node does not work; the coordinate space is copied from the real screen
# (override with screen-size).
#screen = uinput
#screen-size = 1080x1620

# ------------------------------------------------------------ the orientation
#
# How the surface is mounted relative to the screen. Only ever needed if a
# slide scrolls the wrong way or along the wrong axis: run with debug = 1, slide
# down, and see what is reported. pad-rotate is applied first, then the mirrors.
#pad-rotate = 0
#pad-invert-x = 0
#pad-invert-y = 0

# ------------------------------------------------------------------- the feel
#
# scale is screen pixels per pad unit. Left at 0 it becomes
# screen-height / pad-height * gain, i.e. a slide across the whole surface
# drags the whole screen, which is the right starting point on any geometry.
# Set gain (or scale outright) to make scrolling faster or slower. scale-x does
# the same for sideways drags, and defaults to a gain of 1.5 because a sideways
# drag has to cover half the screen before a pager changes page.
#scale = 0
#scale-x = 0
#gain = 1.0
#gain-x = 1.5

# Pad units of travel before a touch is a slide rather than a keypress landing
# on the surface; 0 means a tenth of the surface's height.
#slop = 0

# A touch that starts within this many milliseconds of a key press is ignored
# altogether: typing must never scroll.
#typing-ms = 300

# 0 confines gestures to up and down.
#horizontal = 1

# ---------------------------------------------------------------- cursor mode
#
# While one of these keys is held, a slide sends arrow keys instead of dragging
# the screen, which moves the text cursor. "none" turns cursor mode off.
#cursor-modifier = leftalt,rightalt

# Pad units per arrow key, sideways and vertically. 0 derives them from the
# surface (a twenty-fourth of its width, a fifth of its height).
#cursor-step-x = 0
#cursor-step-y = 0

# --------------------------------------------------------------- word delete
#
# In a text field, a right-to-left slide can delete the word before the cursor.
# It is off until something keeps a file up to date with 1 while a text field
# has focus - only the input method knows that, so this has to be wired up per
# stack (on athena the MaliitServer shim writes /run/athena-text-focus).
#
# The chord is written back into the keyboard the shell is already listening to,
# so the layout and any input-method shim treat it exactly as if it had been
# typed. Anything Ctrl/Alt/Shift/Meta plus one key: leftctrl+backspace,
# leftalt+backspace, leftctrl+w.
#text-focus-file =
#word-delete = leftctrl+backspace

# ------------------------------------------------------------------ the rest
#
# A brightness file that is 0 while the display is off, so a surface pressed
# against a pocket does not wake the stack up to scroll something nobody can
# see. "auto" takes the first of /sys/class/backlight/*/brightness,
# /sys/class/leds/lcd-backlight/brightness or /sys/class/leds/*backlight*.
# "none", or no such file (E Ink, or a panel driven only through DRM), means the
# display is always treated as on.
#backlight = auto

# Log every contact and every decision to the journal. The single most useful
# thing here when a gesture does not do what it should.
#debug = 0

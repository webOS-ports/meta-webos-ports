# BlackBerry KEY2 (athena).
#
# The keys double as a Synaptics touch surface, "touch_keypad", 1080x525,
# protocol B, that nothing else on LuneOS reads. The arrow keys are on their own
# node ("nav_key") and the letters on another ("stmpe_*keypad"), so the
# automatic choice would work here, but naming them is cheaper than a heuristic
# on a device we know.
pad = touch_keypad
screen = synaptics_dsx_2
keys = stmpe_*keypad, nav_key
arrows = nav_key

# Tuned by hand on the hardware. The automatic values land within a few percent
# of each of these (see the geometry line in kbdscroll --list); these are the
# ones the device shipped with, so they stay explicit.
scale = 3.0
scale-x = 1.5
slop = 55
cursor-step-x = 40
cursor-step-y = 95

# webos-keyboard's plugin writes this file on every focus change
# (InputMethod::publishTextFocus), so the gesture knows when it is in a text
# field. Nothing else on the device publishes that outside the compositor.
#
# It used to be /run/athena-text-focus, written by the athena-extras LD_PRELOAD
# shim; that shim is retired and its behaviour is in the plugin itself. Against
# an older image that still has the shim, override the path here.
text-focus-file = /run/maliit-text-focus

# Alt+Backspace is the KEY2's own word delete, and it is what the plugin turns
# into Key::ActionBackspaceWord - so the gesture and the physical keys take the
# same path.
word-delete = leftalt+backspace

# aw2027 LED at i2c 2-0064 drives the panel backlight; it reads 0 whenever the
# display is off or dimmed.
backlight = /sys/class/leds/lcd-backlight/brightness

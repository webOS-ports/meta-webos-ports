# Zinwa Q25 (BlackBerry Classic chassis).
#
# The optical trackpad below the keys, which is the only pointer this phone has.
# Unlike athena's keymat it is RELATIVE: the driver
# (drivers/input/keyboard/bbqX0kbd) advertises nothing but EV_REL REL_X/REL_Y
# and reports signed int8 deltas, so there is no coordinate space, no
# touch-down and no touch-up. kbdscroll synthesises all three - see the header
# of kbdscroll.c for why a relative pad is read at all on a touch-first shell.
#
# The automatic choice already works here, so almost everything below is either
# a name pinned against a future firmware change or a number that differs from
# the geometry-derived default. Run "kbdscroll --list" on the device before
# touching any of it.

# The pad and the whole QWERTY are ONE input device on this phone - the driver
# registers a single node, "Q25_keyboard", carrying EV_KEY for every key and
# EV_REL for the pad (bbqX0kbd_main.c: input->name = DEVICE_NAME). So the same
# device is named as both the pad and a watched keyboard, deliberately: that is
# what lets a keypress cancel a slide.
pad = Q25_keyboard
keys = Q25_keyboard
screen = mtk_touchscreen*

# There are no arrow keys on a Classic layout - the Sym layer produces them, but
# only while Sym is held, which is also the cursor modifier. A device of our own
# is the only way to send them.
arrows = uinput

# The virtual surface the deltas accumulate into. Left at the default (the
# screen's size, so one pad unit is one screen pixel at scale 1.0) because this
# panel is 720x720 and a full sweep of the pad is worth roughly that; raise
# rel-width/rel-height to make the pad feel slower, lower them to make it
# faster. UNTUNED - this is the first number to try on hardware.
# rel-width = 720
# rel-height = 720

# How long the pad must be still before the contact is treated as lifted. The
# hardware only reports movement, so a finger resting motionless is
# indistinguishable from one that has gone; 120 ms is long enough not to break a
# slow drag and short enough that a fling still feels like one.
rel-lift-ms = 120

# Sym rather than Alt. On this keyboard Alt is the symbol layer - Alt+Q is '#' -
# so binding the cursor modifier to it would make every punctuation mark move
# the text cursor instead. Sym (RIGHTALT) already carries the arrow keys in the
# printed layout, which is the same idea the modifier expresses.
cursor-modifier = rightalt

# The Q20's own word delete is Sym+Backspace; the driver turns that into
# KEY_DELETE (bbqX0kbd_get_altgr_keycode), so there is no chord to forward and
# the gesture has to send the pair itself.
word-delete = leftctrl+backspace

# Keyboard and display backlights are driven by the keyboard MCU over I2C rather
# than a leds class device, so there is no brightness file to read and the
# display-off check falls back to always-on. If that turns out to inject touch
# while the screen is off, name a backlight here.
backlight = none

# Zinwa Q25 (BlackBerry Classic chassis).
#
# Nothing to do here. The optical trackpad below the keys is relative: the
# driver (drivers/input/keyboard/bbqX0kbd) reports REL_X/REL_Y deltas on the
# keyboard's own node, "Q25_keyboard", and the compositor already turns those
# into a mouse pointer. Replaying the same slides as a finger on the
# touchscreen as well would fight that pointer.
#
# The automatic choice would pick the pad (its name says "keyboard"), so it is
# switched off by name. With no pad kbdscroll exits 0 and systemd leaves it
# stopped.
pad = none

# Unihertz Titan Pocket (codename Titan_pocket; the lookup lowercases it).
#
# The keys double as a Synaptics RMI4 touch surface, protocol B, which the
# kernel exposes through the mainline RMI4 driver as a touchpad named after the
# controller's product id - "Synaptics 63022-001" as read on the hardware by
# the TitanPocket-OpenLinux project, whose glue driver this kernel carries.
# Their recording of it: ABS_MT_POSITION_X 101-683, Y 120-360.
#
# The compositor reads one named touchscreen and the keyboards, nothing else,
# so nothing on LuneOS consumes the pad but this.
pad = Synaptics*
screen = mtk-tpd
keys = aw9523-key

# There is no separate arrow-key node: the arrows go out through uinput.
arrows = uinput

# Alt is KEY_RIGHTALT on this keyboard, which the default cursor-modifier
# (leftalt,rightalt) already covers, and Fn is Ctrl, so the default word delete
# (leftctrl+backspace) is typeable too.
text-focus-file = /run/maliit-text-focus

# No numbers yet: scale, slop and the cursor steps are derived from the pad's
# and the screen's geometry until someone tunes them on the hardware. Check the
# direction first (kbdscroll --list, then debug=1) and correct the mounting with
# pad-rotate / pad-invert-x / pad-invert-y if a slide scrolls the wrong way.

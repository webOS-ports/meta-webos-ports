# Installed by luneos-remote-wakelock: hold the luneos-ssh kernel wakelock for
# exactly as long as this per-connection sshd instance lives, so the device
# does not suspend under an ssh/scp/sftp session. %i is the connection
# instance ("<n>-<local ip>:<port>-<peer ip>:<port>"), which doubles as the
# token, so concurrent sessions release the lock only when the last one ends.
# The "-" keeps a failing hook from ever refusing a login. The script never
# writes to stdout/stderr here: in this unit those are the client's socket.
[Service]
ExecStartPre=-/usr/sbin/luneos-remote-wakelock lock ssh %i
ExecStopPost=-/usr/sbin/luneos-remote-wakelock unlock ssh %i

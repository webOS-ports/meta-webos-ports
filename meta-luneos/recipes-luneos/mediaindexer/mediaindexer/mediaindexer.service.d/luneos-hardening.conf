# mediaindexer runs TagLib and Qt's image decoders over every file in
# /media/internal. The unit already runs it as "media" with only
# CAP_DAC_READ_SEARCH; this confines the rest. The ExecStartPre= in the unit
# runs as root ("+") and is not affected.
#
# It writes only its file list in /var/luna/data/mediaindexer and the
# thumbnails in /media/internal/.thumbnails (src/MediaStore.cc, src/config.h),
# both made by that ExecStartPre=, and talks to nothing but the luna-service2
# hub and PmLog, both over Unix sockets. MemoryDenyWriteExecute= is left out:
# QtCore can use the PCRE2 JIT (QRegularExpression), and that was not ruled
# out without a device.
[Service]
ProtectSystem=strict
ReadWritePaths=-/var/luna/data/mediaindexer -/media/internal/.thumbnails
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
RemoveIPC=yes
RestrictAddressFamilies=AF_UNIX
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@privileged @resources
SystemCallErrorNumber=EPERM

# tenderloin: /media/internal is webOS's FAT media partition. FAT has no
# owners of its own: everything on it is root's, and chown fails, so the
# "media" user could neither take over .thumbnails nor write anywhere there.
# Making the partition group-writable would hand all of it (the Android
# container's /data and webOS's own files too) to everything in group 1013,
# so the indexer runs as root here instead, as it did before running as
# "media". The capability bounding set (CAP_DAC_READ_SEARCH only) and any
# sandbox drop-in stay, so root writes only what root owns; the file list
# folder is handed back to root for that.
[Service]
User=
Group=
ExecStartPre=
ExecStartPre=+/bin/sh -c 'd=/var/luna/data/mediaindexer; mkdir -p $d && if [ -f /var/luna/data/filenotify.db3 ] && [ ! -e $d/filenotify.db3 ]; then mv /var/luna/data/filenotify.db3* $d/; fi && chown -hR root:root $d && t=/media/internal/.thumbnails; if [ -L $t ] || { [ -e $t ] && [ ! -d $t ]; }; then rm -f $t; fi; mkdir -p $t'

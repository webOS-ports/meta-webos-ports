# Halium default. The key device list is filled in at runtime by
# luneos-device-config's 30-nyx-keys generator, which derives it from the input
# devices advertising KEY_POWER or a volume key.
#
# The value below is a graceful default rather than a placeholder token: if the
# generator does not run, a device with the common power/volume layout still
# works, instead of nyx being handed something unparseable. A device whose
# derived list is wrong pins deviceinfo_key_devices in its adaptation.
[module.keys]
paths=/dev/input/event0;/dev/input/event2;

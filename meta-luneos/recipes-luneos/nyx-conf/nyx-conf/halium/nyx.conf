# Halium default. luneos-device-config rewrites this file at boot from values
# it derives from the device - or from the adaptation's deviceinfo where they
# cannot be derived - and bind-mounts the result over this one. The rootfs is
# never modified, so the image stays universal.
#
# An empty value means "fall through": nyx then uses the compile-time define if
# the machine was built with one, and otherwise its own detection. So a device
# with no adaptation and no generator still works.

[module.keys]
# Filled in at runtime from the input devices advertising KEY_POWER or a volume
# key. Empty on purpose: /dev/input/event0;event2 is the common layout and would
# work on many phones, which is exactly what makes it a bad thing to ship - it
# would be right often enough that the times it silently selected the wrong
# device would be hard to spot. A device whose derived list is wrong pins
# deviceinfo_key_devices_by_name in its adaptation.
paths=

[module.touchpanel]
# Derived: exactly one input device advertises ID_INPUT_TOUCHSCREEN, so this
# needs no per-device knowledge at all. Left empty here on purpose - a wrong
# guess is worse than the fallback, which is nyx's own /dev/input/touchscreen0.
path=

[module.battery]
# Not derived. nyx already walks /sys/class/power_supply for type=Battery and
# that is right on every device we have; the override exists for boards that
# expose more than one, where the walk picks whichever the filesystem returns
# first. Set deviceinfo_battery_sysfs_path to pin it.
sysfs_path=

[module.charger]
# As above, for type=USB and type=Mains. deviceinfo_charger_usb_sysfs_path and
# deviceinfo_charger_ac_sysfs_path pin them.
usb_sysfs_path=
ac_sysfs_path=

# Default configuration. luneos-device-config rewrites this file at boot from
# values it derives from the device - or from the adaptation's deviceinfo where
# they cannot be derived - and bind-mounts the result over this one. The rootfs
# is never modified, so the image stays universal.
#
# Every key the generator may write is declared here, empty. Empty means "fall
# through": nyx then uses the compile-time define if the machine was built with
# one, and otherwise its own detection. A key that is absent rather than empty
# is not written at all, because the generator treats that as the config and
# itself having drifted apart.

[module.keys]
# Filled in at runtime from the input devices advertising KEY_POWER or a volume
# key. Empty on purpose: a plausible default would be right often enough that
# the times it silently selected the wrong device would be hard to spot.
paths=

[module.touchpanel]
# Derived: exactly one input device advertises ID_INPUT_TOUCHSCREEN, so this
# needs no per-device knowledge at all. Left empty here on purpose - a wrong
# guess is worse than the fallback, which is nyx's own /dev/input/touchscreen0.
path=

[module.battery]
# Derived from /sys/class/power_supply. sysfs_path is the battery that powers
# the device; extra_sysfs_paths lists the others as ';' separated "role:path"
# entries, which is how a PinePhone (Pro) keyboard's own cell gets reported
# alongside the phone's. Pin either with deviceinfo_battery_sysfs_path /
# deviceinfo_battery_extra_sysfs_paths when the derivation cannot tell which
# battery is which.
sysfs_path=
extra_sysfs_paths=

[module.charger]
# As above, for type=USB and type=Mains. deviceinfo_charger_usb_sysfs_path and
# deviceinfo_charger_ac_sysfs_path pin them.
usb_sysfs_path=
ac_sysfs_path=

[module.keys]
# Left empty on purpose so luneos-device-config derives this at every boot.
#
# This used to hard-code
#   /dev/input/by-path/platform-adc-keys-event;/dev/input/by-path/platform-fdd40000.i2c-platform-rk805-pwrkey-event
# but the pwrkey link no longer exists under that name: the kernel registers the
# device as .../0-0020/rk805-pwrkey.3.auto/input/input0, and the ".N.auto" MFD
# cell index shifts whenever probe order changes - which it did on the move to
# 7.2. LunaDisplayManager then failed with NYXKEY_OPEN_ERR and no hardware key
# worked at all.
#
# A by-path value is also exactly what set_derived() treats as deliberate
# (looks_like_node_guess only matches bare /dev/input/eventN), so the stale entry
# silently beat the correct derived one. Empty lets the generator win; it lists
# every device advertising ID_INPUT_KEY and re-derives on each boot, so unstable
# event numbering is not a problem.
paths=

[module.touchpanel]
# Derived: exactly one input device advertises ID_INPUT_TOUCHSCREEN, so this
# needs no per-device knowledge at all. Left empty here on purpose - a wrong
# guess is worse than the fallback, which is nyx's own /dev/input/touchscreen0.
path=

[module.battery]
# Derived from /sys/class/power_supply. sysfs_path is the battery that powers
# the device; extra_sysfs_paths lists the others as ';' separated "role:path"
# entries, which is how a PinePhone (Pro) keyboard's own cell gets reported
# alongside the phone's. Pin either with deviceinfo_battery_sysfs_path /
# deviceinfo_battery_extra_sysfs_paths when the derivation cannot tell which
# battery is which.
sysfs_path=
extra_sysfs_paths=

[module.charger]
# As above, for type=USB and type=Mains. deviceinfo_charger_usb_sysfs_path and
# deviceinfo_charger_ac_sysfs_path pin them.
usb_sysfs_path=
ac_sysfs_path=

[module.keys]
paths=/dev/input/event0;/dev/input/event1

[module.touchpanel]
# Derived: exactly one input device advertises ID_INPUT_TOUCHSCREEN, so this
# needs no per-device knowledge at all. Left empty here on purpose - a wrong
# guess is worse than the fallback, which is nyx's own /dev/input/touchscreen0.
path=

[module.battery]
# Derived from /sys/class/power_supply. sysfs_path is the battery that powers
# the device; extra_sysfs_paths lists the others as ';' separated "role:path"
# entries, which is how a PinePhone (Pro) keyboard's own cell gets reported
# alongside the phone's. Pin either with deviceinfo_battery_sysfs_path /
# deviceinfo_battery_extra_sysfs_paths when the derivation cannot tell which
# battery is which.
sysfs_path=
extra_sysfs_paths=
# The pack's capacity in mAh, for a gauge whose driver reports the wrong one.
# Empty means believe the driver. Set with deviceinfo_battery_full_capacity_mah
# and deviceinfo_battery_design_capacity_mah; they apply to the primary battery.
full_capacity_mah=
design_capacity_mah=
# The unit the driver reports current_now and current_avg in, where it is not
# the microamps the power_supply ABI defines. Empty means microamps. Set with
# deviceinfo_battery_current_unit; "mA" is the only other value.
current_unit=

[module.charger]
# As above, for type=USB and type=Mains. deviceinfo_charger_usb_sysfs_path and
# deviceinfo_charger_ac_sysfs_path pin them.
usb_sysfs_path=
ac_sysfs_path=

[module.led]
# The camera flash / torch LED, driven as NYX_DEVICE_LED "Torch" by the
# nyxLedTorch module (it writes <torch_path>/brightness). Derived at runtime
# from /sys/class/leds - the LED whose name marks it a torch or flash - so a
# board with such an LED gets the shell's Flashlight toggle working with no
# per-machine config. Empty falls through to the module's own search. Pin with
# deviceinfo_torch_sysfs_path when the derivation picks the wrong node.
torch_path=

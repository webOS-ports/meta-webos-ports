# uMTP-Responder configuration for LuneOS
#
# Full option reference:
# https://github.com/viveris/uMTP-Responder/blob/master/conf/umtprd.conf

# Keep serving across cable unplug/replug instead of exiting.
loop_on_disconnect 1

# MTP storages. /media/internal is the user data partition on every LuneOS
# device. Additional storages (e.g. SD cards) can be added at runtime with
#   umtprd '-cmd:addstorage:/path "Name" rw,removable'
storage "/media/internal" "Internal Storage" "rw"

# Do not export dot files and dot directories. On Halium the installed apps,
# their data, the browser profile and the media db live in
# /media/internal/.cryptofs (bind-mounted at /media/cryptofs), and umtprd's
# default (show_hidden_files 1) handed all of it to any USB host read-write.
# Hidden entries never get a handle, so their contents cannot be reached.
show_hidden_files 0

manufacturer "LuneOS"
product "LuneOS Device"
serial "0123456789"
firmware_version "1.0"

interface "MTP"
mtp_extensions "microsoft.com: 1.0; android.com: 1.0;"

# USB identity. These only apply when luneos-mtp-gadget has to create a
# standalone gadget (mainline devices); on Halium the composite gadget owned
# by the Android side keeps its own VID/PID.
usb_vendor_id  0x1d6b # Linux Foundation
usb_product_id 0x0100 # PTP Gadget
usb_class 0x6         # Image
usb_subclass 0x1      # Still Imaging device
usb_protocol 0x1
usb_dev_version 0x3008

# FunctionFS mode; the dedicated ffs.luneosmtp instance is created and mounted
# at /dev/ffs-luneosmtp by luneos-mtp-gadget (a dedicated instance avoids the
# android-owned 'mtp' FunctionFS instance, which is contended on halium).
usb_functionfs_mode 0x1
usb_dev_path   "/dev/ffs-luneosmtp/ep0"
usb_epin_path  "/dev/ffs-luneosmtp/ep1"
usb_epout_path "/dev/ffs-luneosmtp/ep2"
usb_epint_path "/dev/ffs-luneosmtp/ep3"
usb_max_packet_size 0x200

# The default of 8 KiB per USB transfer holds a USB 2 phone to under 10 MB/s.
# 64 KiB gets about 20 MB/s; more than that gains nothing on Sargo.
#
# But not 64 KiB itself: 0xFE00 is the largest multiple of the 512-byte packet
# below it. MediaTek's musb driver (drivers/misc/mediatek/usb20, mtk_qmu.c)
# queues each transfer with its length in a 16-bit field of the queue
# descriptor, so 0x10000 wraps to 0. On the Zinwa Q25 a 64 KiB read buffer
# meant umtprd never received the host's OpenSession, the host reset the device
# after 5 s, and File Transfer never got past opening the session; with only
# the write buffer at 64 KiB, a 64 MiB download failed ("PTP Data Expected"),
# though listing folders worked. With 0xFE00
# the Q25 downloads 64 MiB in 2.15 s (2.58 s at the default) and uploads
# 32 MiB in 1.33 s, checksums matching.
usb_max_rd_buffer_size 0xFE00
usb_max_wr_buffer_size 0xFE00
read_buffer_cache_size 0x100000

# The watcher reacts to a file arriving over MTP as well, and the object handle
# just given to the host goes bad: its next request for that file fails and
# the host's copy never finishes.
no_inotify 1

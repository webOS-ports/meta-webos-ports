# uMTP-Responder configuration for LuneOS
#
# Full option reference:
# https://github.com/viveris/uMTP-Responder/blob/master/conf/umtprd.conf

# Keep serving across cable unplug/replug instead of exiting.
loop_on_disconnect 1

# MTP storages. /media/internal is the user data partition on every LuneOS
# device. Additional storages (e.g. SD cards) can be added at runtime with
#   umtprd '-cmd:addstorage:/path "Name" rw,removable'
storage "/media/internal" "Internal Storage" "rw"

manufacturer "LuneOS"
product "LuneOS Device"
serial "0123456789"
firmware_version "1.0"

interface "MTP"
mtp_extensions "microsoft.com: 1.0; android.com: 1.0;"

# USB identity. These only apply when luneos-mtp-gadget has to create a
# standalone gadget (mainline devices); on Halium the composite gadget owned
# by the Android side keeps its own VID/PID.
usb_vendor_id  0x1d6b # Linux Foundation
usb_product_id 0x0100 # PTP Gadget
usb_class 0x6         # Image
usb_subclass 0x1      # Still Imaging device
usb_protocol 0x1
usb_dev_version 0x3008

# FunctionFS mode; endpoints prepared by luneos-mtp-gadget.
usb_functionfs_mode 0x1
usb_dev_path   "/dev/ffs-mtp/ep0"
usb_epin_path  "/dev/ffs-mtp/ep1"
usb_epout_path "/dev/ffs-mtp/ep2"
usb_epint_path "/dev/ffs-mtp/ep3"
usb_max_packet_size 0x200

[Unit]
# The generic rootfs ships this adapter to every device, reader or not.
# luneos-device-config's 38-fingerprint generator writes this marker on a
# device whose vendor declares no fingerprint HAL (or whose deviceinfo says
# deviceinfo_has_fingerprint="false"); there is nothing to adapt then. biomd
# is not affected: it also backs face unlock.
ConditionPathExists=!/run/luneos-device/no-fingerprint
After=luneos-device-config.service

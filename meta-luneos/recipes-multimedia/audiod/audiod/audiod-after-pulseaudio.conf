[Unit]
# audiod drives PulseAudio: it talks to module-palm-policy over a socket and
# cannot register a device until that module answers. Its unit ordered itself
# after ls-hubd only, so it raced PulseAudio at boot.
#
# Losing that race is not harmless. Device discovery arrives before the mixer
# is ready, and what audiod does with a device it cannot hand to PulseAudio yet
# is replay it later - a path that behaves differently from the one taken when
# the mixer is already up. The result was a device with no sound after a cold
# boot, that started working the moment audiod was restarted by hand, which is
# a thoroughly misleading way for an ordering problem to present itself.
#
# Wants=, not Requires=: with Requires= a PulseAudio crash, restarted by
# systemd, took audiod down and up with it. audiod reconnects to a restarted
# PulseAudio by itself, and stays up to do so.
Wants=pulseaudio.service
After=pulseaudio.service

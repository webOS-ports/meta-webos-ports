# Call audio of the messaging connectors' VoIP calls (WhatsApp and Signal in
# imlibpurpleservice): they play to "voip" and record from "voipsource", the
# names webOS's own asound.conf gave them.
#
# voipcall and webcall are the virtual sink and source module-palm-policy
# routes for calls: voipcall onto the output audiod picks (pcm_output, or the
# headset), webcall onto its input (pcm_input). Not pvoip/pvoipsource - palm-
# policy does not route those, so audio there goes nowhere.
pcm.voip {
    type pulse
    device voipcall
}

pcm.voipsource {
    type pulse
    device webcall
}

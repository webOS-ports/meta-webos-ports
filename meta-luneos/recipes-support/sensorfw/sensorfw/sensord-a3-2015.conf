# Samsung Galaxy A3 (2015). Two IIO sensors, both on blsp_i2c2:
#   bosch,bmc150_accel   accelerometer (and a die temperature channel)
#   bosch,bmc150_magn    magnetometer
#
# No gyroscope. The cm36652 light/proximity combo IS present and driven - it
# sits at 0x60 on the same bus, and the cm36652 driver added alongside this
# port binds it. An earlier note here said it had no mainline driver; that was
# written from the A5's device tree, which describes a different part (a
# tmd3782 at 0x39) that this board does not populate. The A3's own vendor tree
# settles it.
#
# The device tree does declare the orientation - msm8916-samsung-a3u-eur.dts
# sets mount-matrix on &accelerometer - but IIO only *publishes* that, as
# in_accel_mount_matrix; it never transforms the samples. Userspace has to
# apply it, and sensorfw's iiosensorsadaptor does not read it either, so
# without the matrix below X and Y stay swapped and the shell sits 90 degrees
# out, following tilt but always rotated.
#
# The value is the vendor's, not a guess. Samsung's own device tree for this
# board - msm8916-sec-a3u-eur-r01.dtsi in the a3ulte kernel - declares
#
#     bma2x2,accel_place = <5>;
#     bmm050,magnetic_place = <5>;
#
# and placement 5 in the Bosch driver's remap table (bst_axis_remap_tab_dft in
# drivers/input/misc/bma2x2.c) is
#
#     /* src_x src_y src_z  sign_x sign_y sign_z */
#     {  1,    0,    2,    -1,    -1,    -1 }  /* P5 */
#
# i.e. out_x = -y, out_y = -x, out_z = -z. Measurement agreed, independently and
# before the vendor tree was found:
#
#   upright portrait, top edge up:  x=-522  y~0    z~-138   -> raw x holds -1g
#   flat, face up:                  x~0     y~0    z=-513   -> raw z holds -1g
#
# P5 alone leaves the shell upside down on device, though: sensorfw wants the
# opposite in-plane sign to the Bosch convention. The matrix below is therefore
# P5 composed with a 180 degree rotation about z - out_x = +y, out_y = +x,
# out_z = -z - which is what is actually correct on the hardware. The vendor
# value still did the useful work of pinning the axis pairing (x/y swapped, z
# inverted); only the in-plane sign is a property of sensorfw rather than of
# the device, so do not "correct" this back to a literal P5.
#
# Determinant is +1 either way, as a real rotation must be. Note this is NOT the
# mainline DT's mount-matrix (0,1,0; 1,0,0; 0,0,1), which is a reflection -
# determinant -1 - and looks like a transcription of the swap without the sign
# flips; anything trusting in_accel_mount_matrix on this device gets a mirrored
# frame.
# Which sensors sensord brings up at start rather than on first request. The
# PinePhone configs preload exactly these three and this device needs the same
# ones: the shell asks for orientation immediately at boot.
preload_sensors="accelerometersensor,orientationsensor,rotationsensor"

[plugins]
accelerometeradaptor = iiosensorsadaptor
orientationadaptor = iiosensorsadaptor
magnetometeradaptor = iiosensorsadaptor
alsadaptor = iiosensorsadaptor

# proximityadaptor is deliberately NOT mapped to iiosensorsadaptor, even though
# the sensor is an IIO one and the [proximity] section below is read. That is
# what the PinePhone and PinePhone Pro do, and proximity works there; mapping it
# the way the other four are mapped leaves it unable to find the device.

# 20 Hz, not the 2 Hz this started out with. The interval pair is min=>max in
# milliseconds and default_interval is what sensorfw actually polls at, so the
# values copied from rosy (200=>2000, default 500) capped the accelerometer at
# 5 Hz and ran it at 2 - which on device reads as the UI simply not reacting to
# being tilted. The bmc150 advertises 15.62 .. 2000 Hz
# (sampling_frequency_available), so 50 ms is comfortably within range.
[accelerometer]
input_match=bmc150_accel
transformation_matrix = "0,1,0,1,0,0,0,0,-1"
intervals = "20=>2000"
default_interval=50

# Same placement as the accelerometer: the vendor tree gives the bmm050
# magnetic_place as 5 too, so it takes the same P5 transform.
[magnetometer]
input_match=bmc150_magn
transformation_matrix = "0,1,0,1,0,0,0,0,-1"

# The cm36652 exposes four raw intensity channels plus proximity, and an
# illuminance channel taken from the green one. Green is what the vendor driver
# reports as the ambient light value, with no conversion of its own, so it is
# the right channel to read rather than a scaled combination of the others.
[als]
input_match=cm36652
intervals = "100=>2000"
default_interval=200

# Proximity is a near/far decision rather than a distance: the chip's own
# thresholds (0x05, set from the A3's vendor values of 20 near and 17 far) do
# the hysteresis, and the reading is the low byte of the data register.
[proximity]
input_match=cm36652
intervals = "100=>2000"
default_interval=200

# HP TouchPad on the 3.4 Halium kernel. Unlike the mainline builds
# (sensord-tenderloin.conf) the sensors here are not IIO: the vendor kernel
# exposes them through its own input and sysfs drivers, and there is no
# Android sensors HAL in the vendor image, so sensorfw reads them directly.

[available]
accelerometersensor=True
alssensor=True
compasssensor=True
magnetometersensor=True
orientationsensor=True
rotationsensor=True
# The MPU3050 is driven by the InvenSense MPU driver (/dev/mpu), which has no
# evdev or sysfs interface sensorfw can read.
gyroscopesensor=False
# There is no proximity sensor on the TouchPad.
proximitysensor=False

[plugins]
accelerometeradaptor = accelerometeradaptor
magnetometeradaptor = magnetometeradaptor-evdev
alsadaptor = alsadaptor-sysfs

# ST LSM303DLH accelerometer at i2c-0 0x18 (input "lsm303dlh_acc_sysfs").

[accelerometer]
input_match = lsm303dlh_acc_sysfs
transformation_matrix = "1,0,0,0,1,0,0,0,1"

# ST LSM303DLH magnetometer at i2c-0 0x1e. The driver registers it disabled;
# sensorfw switches it on through "enable" while a client listens.
[magnetometer]
input_match = lsm303dlh_mag_sysfs
powerstate_path = /sys/bus/i2c/devices/0-001e/enable

# Both LSM303DLH drivers take their poll interval from "pollrate_ms", not the
# input "poll" file the global default points at. sensorfw looks poll_file up
# under the input device name it matched, not under the sensor name.
[lsm303dlh_acc_sysfs]
poll_file = /sys/bus/i2c/devices/0-0018/pollrate_ms

[lsm303dlh_mag_sysfs]
poll_file = /sys/bus/i2c/devices/0-001e/pollrate_ms

# Intersil ISL29023 at i2c-0 0x44. Its input device only reports threshold
# interrupts, so read the lux attribute instead. The chip is powered down at
# probe; 90-tenderloin-halium-sensors.rules switches it to continuous ALS.
[als]
path = /sys/bus/i2c/devices/0-0044/lux
default_interval = 500

# Force-enable the sensor plugins regardless of the hw-features that
# 20-sensors-default.conf would otherwise gate them on. The defaults map
# e.g. alssensor=Feature_LightSensor and require something else in the
# system to assert that feature; with these explicit overrides sensorfwd
# registers the sensor at startup whenever the plugin file is present.
accelerometersensor=True
alssensor=True
gyroscopesensor=True
magnetometersensor=True
orientationsensor=True

# Preload the sensor plugins at sensorfwd startup. Without this the
# libqtsensors_sensorfw.so backend that LunaSysMgr's QAmbientLightSensor
# goes through calls requestSensor() before anything has called
# loadPlugin(), and sensorfwd answers "requested sensor id 'alssensor'
# not registered". See the 0002-sensorfwd-Preload-sensors-listed-in-
# preload_sensors- recipe patch.
preload_sensors=alssensor,accelerometersensor,gyroscopesensor,magnetometersensor,orientationsensor

[plugins]
accelerometeradaptor = iiosensorsadaptor
orientationadaptor = iiosensorsadaptor
alsadaptor = iiosensorsadaptor
magnetometeradaptor = iiosensorsadaptor
gyroscopeadaptor = iiosensorsadaptor

# HP TouchPad uses an ST LSM303DLH 6-axis accel+magn combo at i2c-0 0x18/0x1e.
# IIO name in the mainline st_accel/st_magn drivers is "lsm303dlh_accel" and
# "lsm303dlh_magn". Screen rotation matrix matches the legacy webOS layout
# (board-tenderloin.c set the LSM303 in this orientation for landscape-home).
[accelerometer]
input_match=lsm303dlh_accel
intervals = "200=>2000"
default_interval=500
transformation_matrix = "1,0,0,0,1,0,0,0,1"

[magnetometer]
input_match=lsm303dlh_magn
intervals = "200=>2000"
default_interval=500

# InvenSense MPU3050 gyroscope at i2c-0 0x68. IIO name is "mpu3050".
[gyroscope]
input_match=mpu3050
intervals = "200=>2000"
default_interval=500

# Intersil ISL29023 ambient-light / IR / proximity sensor at i2c-0 0x44.
# The IIO driver is isl29018 (covers the 9018/9023 family). IIO name is
# "isl29023". The chip is mounted under a tinted cover glass that
# strongly attenuates the visible-light channel; without calibration the
# reported lux is ~1/100 of actual ambient. The per-device calibscale is
# applied via the IIO sysfs attribute in_illuminance0_calibscale at boot
# (see the matching udev rule shipped with this package).
[als]
input_match=isl29023
intervals = "200=>2000"
default_interval=500

[Service]
# The compositor is Type=notify and the default start timeout is 90 s. On the
# 32-bit Halium machines (two cores, a lot of services starting at once) its
# first start at boot takes longer than that. The timeout then fails
# surface-manager.service, which webapp-mgr.service requires, so the web app
# manager is never started even though the compositor comes up on its automatic
# restart a few seconds later.
TimeoutStartSec=5min

# Start the compositor with the session bus address in its environment.
#
# dbus-session.service runs dbus-launch and publishes DBUS_SESSION_BUS_ADDRESS
# with "systemctl set-environment". A process only gets that variable if it is
# started afterwards, and the compositor is DefaultDependencies=no, so nothing
# orders it after the bus. Clients that read the session from the compositor -
# waydroid-luneos-session takes XDG_RUNTIME_DIR, WAYLAND_DISPLAY and
# DBUS_SESSION_BUS_ADDRESS from its /proc/<pid>/environ - then never see a bus
# and give up.
#
# On Halium the compositor already waits for android-system.service, which comes
# well after the bus (tenderloin-halium: bus at 16 s, compositor at 52 s), so
# this changes nothing there. Without android-system (qemux86-64) the compositor
# started at 2.2 s and the bus published its address at 2.8 s; with this the
# compositor starts at 2.8 s. dbus-session.service has no [Install] section and
# was only pulled in by voicecall-manager, hence Wants= as well as After=.
[Unit]
Wants=dbus-session.service
After=dbus-session.service

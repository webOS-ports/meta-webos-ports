# LuneOS sleepd configuration, read from /etc/default/sleepd.conf.
#
# The OSE sleepd compiles its whole suspend machinery in but ships it turned
# off: enable_idle_check_thread defaults to 0 and no configuration file is
# installed, so the daemon runs without an idle-check thread, never subscribes
# to display state, and never initiates suspend - the device simply stays
# awake forever. This file is why a LuneOS device sleeps at all.

[suspend]
enable_idle_check_thread=true

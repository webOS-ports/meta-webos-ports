# SM-T520 (n2awifi, Exynos 5420, Mali T628, 1.8 GB RAM, 4 cores): below raster-profile.sh's
# 2.5 GB auto-threshold, so it would default to LG's CPU raster and scroll poorly. GPU raster
# is clearly better here. Verified live 8 Nov 2026 on the tablet: with the stock CPU-raster
# switches, flicking a list in a web app (testr) was sluggish; enabling GPU rasterisation was
# only "a bit better" on its own, but together with vsync (the global drop of
# --disable-gpu-vsync) scrolling became "a lot better". Neither change alone was enough.
# gpu-mem 256 MB and the profile's default raster-thread count (cores/2) are used.
WAM_RASTER=gpu

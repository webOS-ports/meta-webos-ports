# Start WebAppMgr again once the compositor is back.
#
# "systemctl restart surface-manager" stopped WebAppMgr for good. The ExecStop
# of this one-shot is a nested "systemctl stop surface-manager-daemon", which
# stops WebAppMgr through webapp-mgr-compositor.conf's PartOf=, and the
# one-shot's ExecStart only starts the daemon again: nothing started WebAppMgr
# (reproduced on the device). Every web app then hung in "launching" ("WAM is not running. Waiting
# for WAM wakes up...") until the next boot. maliit-server came back only
# because its chain hangs off this unit, not the daemon (Unihertz Titan,
# 12 Nov 2026).
#
# --no-block: this unit is still activating here, and WebAppMgr is ordered
# after it, so waiting for the job would wait for itself. At boot the job
# merges with the one default-webos.target already queued; a WebAppMgr stopped
# on its own stays stopped.
[Service]
ExecStartPost=-/bin/systemctl --no-block start webapp-mgr.service

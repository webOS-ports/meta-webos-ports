# Restart WebAppMgr together with the compositor.
#
# WebAppMgr keeps the Wayland connection of the compositor it started with and
# exits when that compositor goes away. surface-manager.service is only the
# one-shot that launches the compositor; the compositor itself is
# surface-manager-daemon, and every later restart of it - a crash, or a
# "systemctl restart" - left WebAppMgr behind. systemd restarted it at once,
# again and again, while the new compositor was not listening yet ("Failed to
# connect to Wayland display: Connection refused"), hit the start limit within
# two seconds and gave up. LunaAppManager's BootManager then dropped back to "startup" and never left
# it, and the card shell, which only opens the System Menu and takes gestures in
# "normal", ignored them until the next boot (Galaxy Tab Pro 10.1, SM-T520,
# 15 Oct 2026).
#
# PartOf restarts WebAppMgr with the daemon, a crash's automatic restart
# included, and After starts it once the daemon has signalled readiness, that is,
# once its Wayland socket is up. RestartSec keeps a failure for any other reason
# from using up the start limit in a burst. Same as maliit-server@.
[Unit]
PartOf=surface-manager-daemon.service
After=surface-manager-daemon.service

[Service]
RestartSec=2

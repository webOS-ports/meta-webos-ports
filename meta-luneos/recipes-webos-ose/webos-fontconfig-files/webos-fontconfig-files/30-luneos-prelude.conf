<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
    LuneOS: Prelude is the system face, ahead of anything else that claims
    sans-serif.

    31-webos-aliases.conf only appends Prelude after every other family, so
    it wins only while nothing else matches. ttf-wqy-zenhei's
    43-wqy-zenhei-sharp.conf prefers DejaVu Sans, Bitstream Vera Sans and
    WenQuanYi Zen Hei Sharp for sans-serif; with no DejaVu or Vera on the
    image, every QML Text without a font.family came out in WenQuanYi, which
    has no bold face, so bold text was not bold either.

    A <prefer> puts its families just before sans-serif, and an earlier
    file's go ahead of a later one's, so this file has to sort before 43.
    Characters Prelude lacks (Chinese, Japanese, Korean) still fall through
    to WenQuanYi, Droid Sans Fallback and VL Gothic.
-->
<fontconfig>
    <alias binding="same">
        <family>sans-serif</family>
        <prefer>
            <family>Prelude</family>
        </prefer>
    </alias>
</fontconfig>

[General]
ShowReticle=true
DisplayWidth=540
DisplayHeight=960
ShowNotificationsAtTop=false

[UI]
TabletUi=false
# 540x960 on a 4.5" panel is 245 PPI measured, not a density bucket.
# GridUnit follows 50-luna-platform's own formula at the default 1.44 mm:
# round(245 * 1.44 / 25.4) = 14, which puts 38.6 grid units across the short
# edge - the same proportion rosy gets at 19.
DPI=245
GridUnit=14

[Display]
# No ALS on this device: the cm36652 light/proximity combo has no mainline
# driver, so there is nothing for the ALS region logic to read. The nyx ALS
# module is left out for the same reason (nyx-modules-machines.inc).
EnableALS=false
AlsCalibration=1.0

[Hardware]
Type=device
HasVolumeButton=true
HasPowerButton=true
# A physical home key on the front (gpio-keys "Home", KEY_HOMEPAGE), flanked by
# the two tm2-touchkey capacitive keys.
HasHomeButton=true
# True since the panel driver gained a backlight device (see the
# 0001-drm-panel-s6e88a0-ams452ef01-register-a-backlight patch in
# meta-samsung). Note it only blanks - brightness 0 turns the panel off, any
# other value turns it on - because the driver still writes a single fixed
# gamma/AOR operating point. Graduated dimming needs the vendor's per-candela
# AID/ELVSS/gamma tables, as the A5's ams427ap24 driver has. Declaring it true
# is still correct: without it the display manager never issues the blank that
# turns the screen off at all.
HasBrightnessControl=true

# Halium default. DisplayWidth, DisplayHeight and GridUnit are filled in at
# runtime by luneos-device-config's 50-luna-platform generator - geometry from
# the connected DRM connector, GridUnit as a constant physical size of 1.44mm
# so touch targets stay the same size on any panel.
#
# DPI is NOT derived: it is the panel's true physical PPI, which needs physical
# dimensions an internal DSI panel does not report. ro.sf.lcd_density is
# Android's density bucket, close but not the same thing. A device whose DPI
# matters declares deviceinfo_display_dpi; the value below is a mid-range
# default so an unadapted device is merely slightly off rather than broken.
#
# The values here are graceful defaults, not placeholder tokens, so a device
# still gets a usable UI if the generator does not run.
[General]
ShowReticle=true
DisplayWidth=1080
DisplayHeight=1920
ShowNotificationsAtTop=false

[UI]
TabletUi=false
DPI=445
GridUnit=25

[Display]
EnableALS=true

[Hardware]
Type=device
HasVolumeButton=true
HasPowerButton=true
HasHomeButton=false
HasBrightnessControl=true

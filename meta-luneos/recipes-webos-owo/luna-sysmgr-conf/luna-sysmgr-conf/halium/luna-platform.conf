# Halium placeholder.
#
# Every value here that describes the hardware is a placeholder, not a default.
# luneos-device-config's 50-luna-platform generator fills them in at boot -
# panel geometry from DRM, density from the vendor's ro.sf.lcd_density, true DPI
# from the adaptation's deviceinfo where one exists - and bind-mounts the result
# over this file. The rootfs is never written to, so the image stays universal.
#
# The zeros are deliberate. A plausible-looking constant here would be consulted
# as though it were real - the generator used to read DPI back out of this file
# as a fallback, which is how a made-up mid-range value became load-bearing on
# every device that had no adaptation. A zero reaching the UI instead means the
# generator did not run, which is something to notice rather than a slightly
# wrong layout to puzzle over months later.
#
# Anything the generator does not derive still has to be a working value, since
# nothing will replace it. Those are marked below.

[General]
ShowReticle=true
DisplayWidth=0
DisplayHeight=0
ShowNotificationsAtTop=false

[UI]
# Not derived: whether to use the tablet UI is a product decision, not a
# hardware fact, and no property distinguishes a large phone from a tablet.
TabletUi=false
DPI=0
GridUnit=0

[Display]
# Not derived: whether an ALS exists could be, but nothing consumes the answer
# differently yet.
EnableALS=true

[Hardware]
# Not derived. HasVolumeButton and HasPowerButton could come from the same input
# capability scan that finds the key devices; nothing does that yet, and every
# Halium target so far has both.
Type=device
HasVolumeButton=true
HasPowerButton=true
HasHomeButton=false
HasBrightnessControl=true

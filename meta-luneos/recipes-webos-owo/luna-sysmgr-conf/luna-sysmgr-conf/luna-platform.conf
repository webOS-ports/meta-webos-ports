# Generic luna-sysmgr platform configuration.
#
# This is the template every machine starts from. It is deliberately NOT a
# per-device file: luneos-device-config's 50-luna-platform generator rewrites
# the device-specific keys at boot from the panel and from the machine's
# deviceinfo adaptation, and bind-mounts the result over /etc/palm. Adding a
# new device should mean writing an adaptation, not copying this file into a
# machine directory and editing numbers in it.
#
# A machine directory still wins if one exists, for the handful of devices
# whose values were measured by hand before the generator could derive them.
# New ports should not add one.
#
# DPI and GridUnit are 0 on purpose. The generator reads 0 as "not measured"
# and derives both from the panel; any non-zero value here would be taken as a
# measurement and override that derivation on every machine.

[General]
ShowReticle=true
DisplayWidth=0
DisplayHeight=0
ShowNotificationsAtTop=false

[UI]
TabletUi=false
DPI=0
GridUnit=0

[Display]
EnableALS=false
AlsCalibration=1.0

[Hardware]
Type=device
HasVolumeButton=true
HasPowerButton=true
HasHomeButton=false
HasBrightnessControl=true

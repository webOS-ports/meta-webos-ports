[General]
ShowReticle=true
DisplayWidth=480
DisplayHeight=800
ShowNotificationsAtTop=false

[UI]
TabletUi=false
# 190 is not this panel's physical PPI, which is about 233 for a 480x800
# 4.0" display. It is the value the mindset adaptation declares, chosen so
# that GridUnit = round(DPI * 1.44 / 25.4) lands on 11: at the true PPI the
# formula gives 13-14, and the shell chrome is fixed-size in grid units - the
# system menu is Units.gu(40) - so 13 makes it 520px wide on a 480px screen
# and it overflows both edges. Keep the two in step: the adaptation's DPI
# wins at runtime and re-derives GridUnit from it, so a value here that
# disagrees is inert but misleading. It was 400/19 against a 1080x2340 panel
# this device does not have, copied from sargo and never corrected.
DPI=190
GridUnit=11

[Display]
EnableALS=true

[Hardware]
Type=device
HasVolumeButton=true
HasPowerButton=true
HasHomeButton=false
HasBrightnessControl=true
